      <div class="fld"><label>Material Type</label><select id="sm-mt">${mOpts(sb?.materialId||0)}</select></div>
      <div class="fld"><label>Material Weight Usage (kg)</label><input id="sm-mw" type="number" step="0.01" placeholder="0.00" value="${sb?.materialWeightKg||''}"></div>
      <div class="fld"><label>Material Bar Usage (pcs)</label><input id="sm-mb" type="number" step="1" placeholder="0" value="${sb?.materialBarPcs||''}"></div>
      <div class="fld"><label>PO Number</label><input id="sm-po" value="${eH(sb?.poNum||'')}"></div>
      <div class="fld"><label>Start Date (dd-mmm-yy)</label><input id="sm-sd" data-date value="${eH(sb?.startDate||'')}" placeholder="01-Jun-25"></div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;margin-top:8px">
      <span style="font-size:8.5px;font-weight:700;color:var(--text2);letter-spacing:.05em;text-transform:uppercase">ETD Schedule (multiple shipments)</span>
      <button type="button" onclick="_addEtdRow()" class="btn-addop" style="margin-top:0">+ Add ETD</button>

    <div style="font-size:8.5px;font-weight:700;color:var(--text2);letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px;margin-top:10px">Process Stages</div>
    ${procRows}`;
  document.getElementById('mo').classList.add('open');
  bindDates(document.getElementById('mdl-body'));
  bindDates(document.getElementById('etd-rows-wrap'));
  _saveFn=()=>{
    const pnVal=document.getElementById('sm-pn').value;
    const prt=DB.parts.find(p=>p.pn===pnVal);
    const stagesFromPart=prt?prt.ops.map(o=>getProc(o.processId).name):[];
    const stages=['Material','Tooling',...stagesFromPart.filter(n=>!['Material','Tooling'].includes(n))];
    const newProcs=stages.map((name,pi)=>({name,
      startPlan:fmtDate(document.getElementById(`ps-sp-${pi}`)?.value||''),
      startActual:fmtDate(document.getElementById(`ps-sa-${pi}`)?.value||''),
      endPlan:fmtDate(document.getElementById(`ps-ep-${pi}`)?.value||''),
      endActual:fmtDate(document.getElementById(`ps-ea-${pi}`)?.value||'')}));
    // Collect ETD rows (filter out empty ones)
    const cleanEtds = _etdRows.filter(e=>e.date).map(e=>({date:fmtDate(e.date),qty:e.qty||0}));
    cleanEtds.sort((a,b)=>(parseDt(a.date)||0)-(parseDt(b.date)||0));
    // Fallback single etdDate = earliest ETD; shipQty = sum of all ETD qtys (for backward-compat columns/charts)
    const fallbackEtd = cleanEtds.length ? cleanEtds[0].date : '';
    const sumEtdQty = cleanEtds.reduce((s,e)=>s+(e.qty||0),0);
    const obj={id:sb?.id||genSbId(),customer:document.getElementById('sm-cu').value,pn:pnVal,

      materialId:parseInt(document.getElementById('sm-mt').value)||0,
      materialWeightKg:parseFloat(document.getElementById('sm-mw').value)||0,
      materialBarPcs:parseInt(document.getElementById('sm-mb').value)||0,
      procs:newProcs};
    if(_editIdx>=0){
      _apiFetch('/samples/'+DB.samples[_editIdx]._dbId,'PUT',{
        id:obj.id,customer:obj.customer,pn:obj.pn,plan_qty:obj.planQty,actual_qty:obj.actualQty,
        ship_qty:obj.shipQty,po_num:obj.poNum,start_date:obj.startDate,etd_date:obj.etdDate,
        shipped_date:obj.shippedDate||'',unit_price_usd:obj.unitPriceUSD||0,
        selling_price_usd:obj.sellingPriceUSD||0,cost_pc:obj.costPc||0,cost_unit:obj.costUnit||'USD',
        material_id:obj.materialId||null,material_weight_kg:obj.materialWeightKg||0,material_bar_pcs:obj.materialBarPcs||0,
        etds:obj.etds,
        procs:obj.procs.map(p=>({name:p.name,start_plan:p.startPlan,start_actual:p.startActual,end_plan:p.endPlan,end_actual:p.endActual}))
      }).then(()=>loadFromDB().then(()=>rdSample()));
      DB.samples[_editIdx]=obj;
    } else {
      _apiFetch('/samples','POST',{
        id:obj.id,customer:obj.customer,pn:obj.pn,plan_qty:obj.planQty,actual_qty:obj.actualQty,
        ship_qty:obj.shipQty,po_num:obj.poNum,start_date:obj.startDate,etd_date:obj.etdDate,
        shipped_date:obj.shippedDate||'',unit_price_usd:obj.unitPriceUSD||0,
        selling_price_usd:obj.sellingPriceUSD||0,cost_pc:obj.costPc||0,cost_unit:obj.costUnit||'USD',
        material_id:obj.materialId||null,material_weight_kg:obj.materialWeightKg||0,material_bar_pcs:obj.materialBarPcs||0,
        etds:obj.etds,
        procs:obj.procs.map(p=>({name:p.name,start_plan:p.startPlan,start_actual:p.startActual,end_plan:p.endPlan,end_actual:p.endActual}))
      }).then(()=>loadFromDB().then(()=>rdSample()));
      DB.samples.push(obj);
    }
    rdSample();
  };
}

const API = window.location.origin + '/api';

function _setDbStatus(ok, msg){
  const el = document.getElementById('db-status');
  if(!el) return;
  if(ok){ el.style.background='#dcfce7'; el.style.color='#166534'; el.style.borderColor='#bbf7d0'; el.textContent='● '+msg; }
  else  { el.style.background='#fee2e2'; el.style.color='#991b1b'; el.style.borderColor='#fca5a5'; el.textContent='● '+msg; }
}

async function _apiFetch(path, method='GET', body=null){
  const opts = { method, headers:{'Content-Type':'application/json'} };
  if(body) opts.body = JSON.stringify(body);
  try{
    const r = await fetch(API + path, opts);
    const j = await r.json();
    if(!j.ok) throw new Error(j.error||'API error');
    return j.data;
  } catch(e){
    _setDbStatus(false,'DB Error');
    console.error('API error:', path, e);
    throw e;
  }
}

      _dbId: s.id

      id: i.issue_id, partUid: i.part_uid, title: i.title,
      severity: i.severity, status: i.status, owner: i.owner||'',
      date: i.date||'', notes: i.notes||'', _dbId: i.id

// Import old JSON file into database
function importJSONtoDB(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='.json';
  inp.onchange = async ev => {
    const file = ev.target.files[0]; if(!file) return;
    const r = new FileReader();
    r.onload = async e => {
      try{
        const raw = JSON.parse(e.target.result);
        // Normalise old frontend JSON format to match what /import expects
        const payload = _normaliseImportPayload(raw);
        await _apiFetch('/import','POST', payload);
        await loadFromDB();
        rr();
        alert('✅ Data imported successfully into database!');
      } catch(err){
        console.error('Import error:', err);
        alert('❌ Import failed: '+(err.message||err));
      }
    };
    r.readAsText(file);
  };
  inp.click();
}

// Normalise the old localStorage JSON format so the /import endpoint understands it

  // The old JSON uses camelCase; the import endpoint also accepts camelCase — just make sure
  // top-level keys exist

  return {
    reg: {
      customers: (reg.customers||[]).map(c=>({id:c.id, name:c.name})),
      processes:  (reg.processes||[]).map(p=>({id:p.id, name:p.name, machines:p.machines||[]})),
      materials:  (reg.materials||[]).map(m=>({id:m.id, type:m.type, size:m.size||'', length:m.length||''})),
    },
    parts: (d.parts||[]).map(p=>({
      uid: p.uid, pn: p.pn, name: p.name, rev: p.rev||'Rev A',
      customerId: p.customerId, program: p.program||'', engineer: p.engineer||'',
      ppapLevel: p.ppapLevel||3, partType: p.partType, partStatus: p.partStatus||'Active',
      sop: p.sop||'', materialId: p.materialId,
      pswDate: p.pswDate||'', notes: p.notes||'', status: p.status||'on-track',
      ops: (p.ops||[]).map(o=>({op:o.op, processId:o.processId, machine:o.machine||'', ct:o.ct||''})),
      apqp: p.apqp||null,
      ppap: p.ppap||null,
    })),
    samples: (d.samples||[]).map(s=>({
      id: s.id, customer: s.customer, pn: s.pn,
      planQty: s.planQty||0, actualQty: s.actualQty, shipQty: s.shipQty||0,
      poNum: s.poNum||'', startDate: s.startDate||'', etdDate: s.etdDate||'',
      shippedDate: s.shippedDate||'',
      unitPriceUSD: s.unitPriceUSD||0, sellingPriceUSD: s.sellingPriceUSD||0,
      costPc: s.costPc||0, costUnit: s.costUnit||'USD',
      nw: s.nw, gw: s.gw,
      procs: (s.procs||[]).map(p=>({
        name:p.name, startPlan:p.startPlan||'', startActual:p.startActual||'',
        endPlan:p.endPlan||'', endActual:p.endActual||''
      })),
    })),
    issues: (d.issues||[]).map(i=>({
      id: i.id, partUid: i.partUid||'', title: i.title||'',
      severity: i.severity||'medium', status: i.status||'open',

// ════════════════════════════════════════════════════════
//  SMART FILE VIEWER
//  PDF/images → open directly
//  Office files → Microsoft Office Online viewer
//  CAD/others  → download
// ════════════════════════════════════════════════════════
async function _smartOpenFile(fileUrl, filename){
  if(!fileUrl || !filename) return;
  // Strip timestamp prefix to get clean display name
  const clean = filename.replace(/^\d+_/,'');
  const cleanExt = clean.split('.').pop().toLowerCase();

  // PDF and images — open directly in browser tab (always works)
  const viewExts = ['pdf','jpg','jpeg','png','gif','webp','svg','tif','tiff','bmp'];
  if(viewExts.includes(cleanExt)){
    window.open(fileUrl, '_blank');
    return;
  }

  // For Office, DWG and other files — try to open on server PC directly
  // This works best when user is ON the server PC
  // For other LAN PCs it falls back to download
  try{
    // Convert browser URL back to server file path
    // fileUrl = http://192.168.x.x:3001/Project/PN/...
    const urlPath = new URL(fileUrl).pathname; // /Project/PN/...
    const resp = await fetch(window.location.origin + '/api/open-file', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ filePath: urlPath })
    });
    const j = await resp.json();
    if(j.ok){
      _showFileToast(`✅ Opening ${clean} on server PC...`);
      return;
    }
    throw new Error(j.error||'Could not open');
  } catch(e){
    // Fallback — download to user's PC
    _showFileToast(`📥 Downloading ${clean} to your PC...`);
    const a = document.createElement('a');
    a.href = fileUrl;
    a.download = clean;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
}

function _showFileToast(msg){
  let t = document.getElementById('file-toast');
  if(!t){
    t = document.createElement('div');
    t.id = 'file-toast';
    t.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:9999;padding:8px 18px;border-radius:7px;font-size:11px;font-weight:600;color:#fff;background:#1E6FD9;box-shadow:0 4px 16px rgba(0,0,0,.22);transition:opacity .4s;pointer-events:none';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._to);
  t._to = setTimeout(()=>{ t.style.opacity='0'; }, 3500);
}

// In-memory map: "partUid_phN_itN" → [filename, ...]
let _apqpFiles = {};
// Cache of which parts have folder structure created
let _folderExists = {};

// Load APQP file list from server on startup
async function loadApqpFiles(){
  try{
    const data = await _apiFetch('/apqp-files');
    _apqpFiles = data || {};
  } catch(e){ console.warn('Could not load APQP files', e); }
}

// Check if folder structure exists for a part
async function checkFolderExists(pn){
  if(_folderExists[pn] !== undefined) return _folderExists[pn];
  try{
    const r = await _apiFetch('/check-folders/'+encodeURIComponent(pn));
    _folderExists[pn] = r.exists;
    return r.exists;
  } catch(e){ return false; }
}


// Wrapper so upload button onclick stays simple (avoids template literal escaping issues)

function _apqpViewBtn(el){
  const uid   = el.getAttribute('data-uid');
  const pn    = el.getAttribute('data-pn');
  const phIdx = parseInt(el.getAttribute('data-ph'));
  const itIdx = parseInt(el.getAttribute('data-it'));
  const fi    = parseInt(el.getAttribute('data-fi'));
  viewApqpFile(uid, pn, phIdx, itIdx, fi);
}

function _apqpUploadBtn(btn){
  const uid    = btn.getAttribute('data-uid');
  const pn     = btn.getAttribute('data-pn');
  const phIdx  = parseInt(btn.getAttribute('data-ph'));
  const itIdx  = parseInt(btn.getAttribute('data-it'));
  const phName = btn.getAttribute('data-phname');
  const item   = btn.getAttribute('data-item');
  triggerApqpUpload(uid, pn, phIdx, itIdx, phName, item);
}

function triggerApqpUpload(partUid, partPn, phIdx, itIdx, phName, itemName){
  // Create and click file input SYNCHRONOUSLY (must happen in user gesture context)
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png,.dwg,.ppt,.pptx';
  inp.onchange = async ev => {
    const file = ev.target.files[0]; if(!file) return;
    // Now check folder exists (async is fine here — file already selected)
    const exists = await checkFolderExists(partPn);
    if(!exists){
      alert(`❌ Folder structure not found for ${partPn}.\n\nPlease click "📁 Create Folder Structure" first before uploading documents.`);
      return;
    }
    const fd = new FormData();
    fd.append('file', file);
    fd.append('partUid', partUid);
    fd.append('partPn', partPn);
    fd.append('phIdx', phIdx);
    fd.append('itIdx', itIdx);
    fd.append('phName', phName);
    fd.append('itemName', itemName);
    try{
      const r = await fetch(window.location.origin + '/api/apqp-upload', { method:'POST', body:fd });
      const j = await r.json();
      if(!j.ok) throw new Error(j.error);
      const key = `${partUid}_ph${phIdx}_it${itIdx}`;
      if(!_apqpFiles[key]) _apqpFiles[key] = [];
      _apqpFiles[key].push(j.data.filename);
      rdApqp();
    } catch(e){ alert('❌ Upload failed: '+e.message); }
  };
  inp.click(); // must be synchronous — triggers browser file picker
}

function viewApqpFile(partUid, partPn, phIdx, itIdx, fileIdx){
  const key = `${partUid}_ph${phIdx}_it${itIdx}`;
  const fn = (_apqpFiles[key]||[])[fileIdx];
  if(!fn) return;
  // Ask server for the correct URL (server knows the safeName-converted path)
  _apiFetch(`/apqp-file-url/${encodeURIComponent(partUid)}/${phIdx}/${itIdx}/${encodeURIComponent(fn)}`)
    .then(data => {
      if(data && data.url){
        const fullUrl = `${window.location.origin}${data.url}`;
        _smartOpenFile(fullUrl, data.url.split('/').pop());
      } else alert('File not found on server. It may have been moved or deleted.');
    })
    .catch(() => alert('Could not locate file on server.'));
}

async function delApqpFile(partUid, phIdx, itIdx, fileIdx){
  const key = `${partUid}_ph${phIdx}_it${itIdx}`;
  const fn = (_apqpFiles[key]||[])[fileIdx];
  if(!fn || !confirm(`Delete file: ${fn}?`)) return;
  try{
    await _apiFetch(`/apqp-files/${encodeURIComponent(partUid)}/${phIdx}/${itIdx}/${encodeURIComponent(fn)}`, 'DELETE');
    _apqpFiles[key].splice(fileIdx, 1);
    rdApqp();
  } catch(e){ alert('Delete failed: '+e.message); }
}

// persist() — no-op now, all saves are done individually per action

function csvRow(cells){return cells.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',');}
function downloadCSV(filename,rows){
  const blob=new Blob([rows.join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=filename;a.click();URL.revokeObjectURL(a.href);
}

function exportPartsCSV(){
  const hdr=csvRow(['UID','Part No.','Part Name','Rev','Customer','Program','Engineer','Part Type','Part Status','PPAP Level','PPAP Status','PSW Status','PSW Date','SOP','Material','Process Flow','Notes']);
  const rows=[hdr,...DB.parts.map(p=>{
    const c=getCust(p.customerId);const mat=getMat(p.materialId);
    const ops=p.ops.map(o=>getProc(o.processId).name).join(' → ');
    return csvRow([p.uid,p.pn,p.name,p.rev,c.name,p.program,p.engineer,p.partType,p.partStatus||'Active',p.ppapLevel,ppapStatusOf(p),p.ppap?.pswStatus||'',p.pswDate||'',p.sop||'',matShort(mat),ops,p.notes||'']);
  })];
  downloadCSV('npd_parts.csv',rows);
}

function exportSampleCSV(){
  const hdr=csvRow(['ID','Customer','Part No.','Plan Qty','Actual Qty','Ship Qty','Process Stage','Status','Start Date','ETD Date','Shipped Date','PO Number','Unit Price (USD)','Selling Price (USD)']);
  const rows=[hdr,...DB.samples.map(sb=>{
    const {proc,status:st}=currentProc(sb);
    const stage=sb.shippedDate?'Shipped to Customer':proc.name;
    const status=sb.shippedDate?'Closed':st;
    return csvRow([sb.id,sb.customer,sb.pn,sb.planQty,sb.actualQty??'',sb.shipQty,stage,status,sb.startDate||'',sb.etdDate||'',sb.shippedDate||'',sb.poNum||'',sb.unitPriceUSD?.toFixed(2)||'',sb.sellingPriceUSD?.toFixed(2)||'']);
  })];
  downloadCSV('sample_build.csv',rows);
}

  const f=DB._apqpFiles||{};

}
function setApqpFiles(partUid,phIdx,itIdx,files){
  if(!DB._apqpFiles)DB._apqpFiles={};
  if(!DB._apqpFiles[partUid])DB._apqpFiles[partUid]={};
  if(!DB._apqpFiles[partUid][phIdx])DB._apqpFiles[partUid][phIdx]={};

}
function uploadApqpFile(partUid,phIdx,itIdx,input){
  const file=input.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=e=>{
    const existing=getApqpFiles(partUid,phIdx,itIdx);
    existing.push({name:file.name,dataUrl:e.target.result,size:file.size,uploaded:todayFmt()});
    setApqpFiles(partUid,phIdx,itIdx,existing);
    rdApqp();
  };
  r.readAsDataURL(file);input.value='';
}

  const f=files[fi];if(!f)return;
  const a=document.createElement('a');a.href=f.dataUrl;a.download=f.name;a.click();
}
function deleteApqpFile(partUid,phIdx,itIdx,fi){
  const files=getApqpFiles(partUid,phIdx,itIdx);
  files.splice(fi,1);setApqpFiles(partUid,phIdx,itIdx,files);rdApqp();
}

function _loadExcelJs(cb){
  const need=[];
  if(typeof ExcelJS==='undefined') need.push('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js');
  if(typeof JSZip==='undefined') need.push('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
  let i=0;
  const next=()=>{
    if(i>=need.length){cb();return;}
    const s=document.createElement('script');s.src=need[i++];s.onload=next;document.head.appendChild(s);
  };
  next();
}
function _readDomTable(tbl){
  const rows=[];
  tbl.querySelectorAll('tr').forEach(tr=>{
    const r=[];
    tr.querySelectorAll('th,td').forEach(c=>r.push(c.innerText.trim()));
    if(r.length) rows.push(r);
  });
  return rows;
}
function _addTableToSheet(ws,title,rows,startRow){
  const info={headerRow:0,firstDataRow:0,lastDataRow:0,cols:0,nextRow:startRow};
  if(title){
    const tc=ws.getCell(startRow,1);
    tc.value=title; tc.font={bold:true,size:13,color:{argb:'FF2563EB'}};
    startRow+=2;
  }
  if(!rows||!rows.length){
    ws.getCell(startRow,1).value='(no data)';
    info.nextRow=startRow+2; return info;
  }
  rows.forEach((r,ri)=>{
    r.forEach((v,ci)=>{
      const cell=ws.getCell(startRow+ri,1+ci);
      const cleaned=(typeof v==='string')?v.replace(/[$,\s]/g,''):v;
      const num=(typeof v==='string')?Number(cleaned):NaN;
      cell.value=(typeof v==='string'&&v!=='—'&&v!==''&&!isNaN(num)&&/^[\$\-\d,\.\s]+$/.test(v))?num:v;
      if(ri===0){
        cell.font={bold:true,color:{argb:'FF455A82'},size:10};
        cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFEAF0FA'}};
        cell.alignment={horizontal:'center',vertical:'middle'};
      } else { cell.font={size:10}; }
      cell.border={top:{style:'thin',color:{argb:'FFDCE3F2'}},bottom:{style:'thin',color:{argb:'FFDCE3F2'}},left:{style:'thin',color:{argb:'FFDCE3F2'}},right:{style:'thin',color:{argb:'FFDCE3F2'}}};
    });
  });
  const cols=Math.max(...rows.map(r=>r.length));
  for(let c=1;c<=cols;c++){
    let maxLen=8;
    rows.forEach(r=>{const s=String(r[c-1]||'');if(s.length>maxLen)maxLen=s.length;});
    const col=ws.getColumn(c);
    if(!col.width||col.width<Math.min(maxLen+2,40)) col.width=Math.min(maxLen+2,40);
  }
  info.headerRow=startRow;
  info.firstDataRow=startRow+1;
  info.lastDataRow=startRow+rows.length-1;
  info.cols=cols;
  info.headers=rows[0];
  info.nextRow=startRow+rows.length+2;
  return info;
}
function _addBarRowsAsTable(ws,title,rowsDiv,startRow){
  if(!rowsDiv) return {nextRow:startRow};
  const items=[];
  rowsDiv.querySelectorAll('.cust-bar-row').forEach(r=>{
    const name=r.querySelector('.cust-name')?.innerText.trim()||'';
    const txts=[...r.querySelectorAll('*')].map(x=>x.innerText.trim()).filter(Boolean);
    const valTxt=txts[txts.length-1]||'';
    items.push([name,valTxt]);
  });
  if(!items.length) return {nextRow:startRow};
  const data=[['Name','Sales (USD)'],...items];
  return _addTableToSheet(ws,title,data,startRow);
}

// Excel column index (1-based) → letter
function _colL(n){let s='';while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;}
function _ref(sheet,c1,r1,c2,r2){
  const q=sheet.replace(/'/g,"''");
  const sn=/[^A-Za-z0-9_]/.test(sheet)?`'${q}'`:sheet;
  return `${sn}!$${_colL(c1)}$${r1}:$${_colL(c2)}$${r2}`;
}

// Build chart XML (bar/line/pie) with data references so Excel updates on edit
function _buildChartXml(spec){
  const t=spec.type||'bar';
  const cat=spec.cat; // {col,r1,r2}

  // ── 3D Pie chart ──
  if(t==='pie3d'){
    const ser=spec.series[0];
    const catF=_ref(spec.sheetName,cat.col,cat.r1,cat.col,cat.r2);
    const valF=_ref(spec.sheetName,ser.col,ser.r1,ser.col,ser.r2);
    const colorXml=(spec.colors||[]).map((c,i)=>`<c:dPt><c:idx val="${i}"/><c:spPr><a:solidFill><a:srgbClr val="${c}"/></a:solidFill><a:effectLst/></c:spPr></c:dPt>`).join('');
    const ttl=(spec.title||'').replace(/[<>&"]/g,ch=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[ch]||ch));
    const titleXml=ttl?`<c:title><c:tx><c:rich><a:bodyPr/><a:lstStyle/><a:p><a:r><a:rPr lang="en-US" b="1" sz="1400"/><a:t>${ttl}</a:t></a:r></a:p></c:rich></c:tx><c:overlay val="0"/></c:title><c:autoTitleDeleted val="0"/>`:'<c:autoTitleDeleted val="1"/>';
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`+
      `<c:chartSpace xmlns:c="http://schemas.openxmlformats.org/drawingml/2006/chart" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">`+
      `<c:lang val="en-US"/><c:roundedCorners val="0"/>`+
      `<c:chart>${titleXml}<c:plotArea>`+
      `<c:layout><c:manualLayout><c:xMode val="edge"/><c:yMode val="edge"/><c:x val="0.1"/><c:y val="0.05"/><c:w val="0.65"/><c:h val="0.85"/></c:manualLayout></c:layout>`+
      `<c:pie3DChart><c:varyColors val="1"/>`+
      `<c:ser><c:idx val="0"/><c:order val="0"/>${colorXml}`+
      `<c:dLbls><c:spPr><a:noFill/><a:ln><a:noFill/></a:ln></c:spPr>`+
      `<c:numFmt formatCode="0%" sourceLinked="0"/><c:dLblPos val="bestFit"/>`+
      `<c:showLegendKey val="0"/><c:showVal val="0"/><c:showCatName val="1"/>`+
      `<c:showSerName val="0"/><c:showPercent val="1"/><c:showBubbleSize val="0"/><c:showLeaderLines val="1"/>`+
      `</c:dLbls>`+
      `<c:cat><c:strRef><c:f>${catF}</c:f></c:strRef></c:cat>`+
      `<c:val><c:numRef><c:f>${valF}</c:f></c:numRef></c:val>`+
      `</c:ser><c:firstSliceAng val="0"/></c:pie3DChart></c:plotArea>`+
      `<c:legend><c:legendPos val="r"/><c:overlay val="0"/></c:legend>`+
      `<c:plotVisOnly val="1"/><c:dispBlanksAs val="gap"/></c:chart>`+
      `<c:printSettings><c:headerFooter/><c:pageMargins b="0.75" l="0.7" r="0.7" t="0.75" header="0.3" footer="0.3"/><c:pageSetup/></c:printSettings>`+
      `</c:chartSpace>`;
  }

  const cats=`<c:cat><c:strRef><c:f>${_ref(spec.sheetName,cat.col,cat.r1,cat.col,cat.r2)}</c:f></c:strRef></c:cat>`;
  const seriesXml=spec.series.map((s,i)=>{
    const valRef=_ref(spec.sheetName,s.col,s.r1,s.col,s.r2);
    const nameRef=s.nameCol?`<c:tx><c:strRef><c:f>${_ref(spec.sheetName,s.nameCol,s.nameRow,s.nameCol,s.nameRow)}</c:f></c:strRef></c:tx>`:`<c:tx><c:v>${(s.name||'Series').replace(/[<>&]/g,'')}</c:v></c:tx>`;
    const color=(spec.colors&&spec.colors[i])||['2563EB','0EA5E9','16A34A','D97706','DC2626','7C3AED'][i%6];
    const spPr=`<c:spPr><a:solidFill><a:srgbClr val="${color}"/></a:solidFill></c:spPr>`;
    return `<c:ser><c:idx val="${i}"/><c:order val="${i}"/>${nameRef}${spPr}${cats}<c:val><c:numRef><c:f>${valRef}</c:f></c:numRef></c:val></c:ser>`;
  }).join('');

  let plot='';
  if(t==='pie'){
    plot=`<c:pieChart><c:varyColors val="1"/>${seriesXml}</c:pieChart>`;
  } else if(t==='line'){
    plot=`<c:lineChart><c:grouping val="standard"/>${seriesXml}<c:marker val="1"/><c:axId val="1"/><c:axId val="2"/></c:lineChart>`+
      `<c:catAx><c:axId val="1"/><c:scaling><c:orientation val="minMax"/></c:scaling><c:delete val="0"/><c:axPos val="b"/><c:crossAx val="2"/></c:catAx>`+
      `<c:valAx><c:axId val="2"/><c:scaling><c:orientation val="minMax"/></c:scaling><c:delete val="0"/><c:axPos val="l"/><c:crossAx val="1"/></c:valAx>`;
  } else {
    plot=`<c:barChart><c:barDir val="${spec.barDir||'col'}"/><c:grouping val="clustered"/>${seriesXml}<c:axId val="1"/><c:axId val="2"/></c:barChart>`+
      `<c:catAx><c:axId val="1"/><c:scaling><c:orientation val="minMax"/></c:scaling><c:delete val="0"/><c:axPos val="b"/><c:crossAx val="2"/></c:catAx>`+
      `<c:valAx><c:axId val="2"/><c:scaling><c:orientation val="minMax"/></c:scaling><c:delete val="0"/><c:axPos val="l"/><c:crossAx val="1"/></c:valAx>`;
  }

  const titleXml=spec.title?`<c:title><c:tx><c:rich><a:bodyPr/><a:lstStyle/><a:p><a:r><a:rPr lang="en-US" b="1" sz="1200"/><a:t>${spec.title.replace(/[<>&]/g,'')}</a:t></a:r></a:p></c:rich></c:tx><c:overlay val="0"/></c:title><c:autoTitleDeleted val="0"/>` :'';

  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<c:chartSpace xmlns:c="http://schemas.openxmlformats.org/drawingml/2006/chart" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<c:chart>${titleXml}<c:plotArea><c:layout/>${plot}</c:plotArea><c:legend><c:legendPos val="r"/><c:overlay val="0"/></c:legend><c:plotVisOnly val="1"/></c:chart></c:chartSpace>`;
}

async function _injectCharts(buf, chartsBySheet){
  const zip=await JSZip.loadAsync(buf);
  // Get workbook sheet order to map sheet names to xl/worksheets/sheetN.xml
  const wbXml=await zip.file('xl/workbook.xml').async('string');
  const wbRelsXml=await zip.file('xl/_rels/workbook.xml.rels').async('string');
  // parse sheets
  const sheets=[...wbXml.matchAll(/<sheet\b([^>]*)\/>/g)].map(m=>{const a=m[1];const name=(a.match(/name="([^"]+)"/) ||[])[1]||'';const rid=(a.match(/r:id="([^"]+)"/) ||[])[1]||'';return {name,rid};});
  const relMap={};
  [...wbRelsXml.matchAll(/<Relationship[^>]*Id="([^"]+)"[^>]*Target="([^"]+)"/g)].forEach(m=>relMap[m[1]]=m[2]);

  let chartIdx=1, drawIdx=1;
  const ctOverrides=[];

  for(const sheetName of Object.keys(chartsBySheet)){
    const charts=chartsBySheet[sheetName];
    if(!charts||!charts.length) continue;
    const meta=sheets.find(s=>s.name===sheetName);
    if(!meta) continue;
    const sheetPath='xl/'+relMap[meta.rid].replace(/^\//,'');
    const sheetFile=sheetPath; // e.g. xl/worksheets/sheet1.xml
    const sheetRelsPath=sheetFile.replace(/worksheets\//,'worksheets/_rels/')+'.rels';

    const drawingId=drawIdx++;
    const drawingPath=`xl/drawings/drawing${drawingId}.xml`;
    const drawingRelsPath=`xl/drawings/_rels/drawing${drawingId}.xml.rels`;

    // Build drawing anchors + chart files
    const anchors=[]; const drawRels=[];
    charts.forEach((c,i)=>{
      const cId=chartIdx++;
      const chartPath=`xl/charts/chart${cId}.xml`;
      zip.file(chartPath,_buildChartXml(c));
      // chart rels (empty but required folder; create minimal)
      const rId=`rId${i+1}`;
      drawRels.push(`<Relationship Id="${rId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/chart" Target="../charts/chart${cId}.xml"/>`);
      ctOverrides.push(`<Override PartName="/${chartPath}" ContentType="application/vnd.openxmlformats-officedocument.drawingml.chart+xml"/>`);
      const a=c.anchor||{fromCol:5,fromRow:1,toCol:14,toRow:18};
      anchors.push(`<xdr:twoCellAnchor editAs="oneCell"><xdr:from><xdr:col>${a.fromCol}</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>${a.fromRow}</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:from><xdr:to><xdr:col>${a.toCol}</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>${a.toRow}</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:to><xdr:graphicFrame macro=""><xdr:nvGraphicFramePr><xdr:cNvPr id="${i+2}" name="Chart ${cId}"/><xdr:cNvGraphicFramePr/></xdr:nvGraphicFramePr><xdr:xfrm><a:off x="0" y="0"/><a:ext cx="5486400" cy="3200400"/></xdr:xfrm><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/chart"><c:chart xmlns:c="http://schemas.openxmlformats.org/drawingml/2006/chart" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" r:id="${rId}"/></a:graphicData></a:graphic></xdr:graphicFrame><xdr:clientData/></xdr:twoCellAnchor>`);
    });

    const drawingXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

    const drawingRelsXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${drawRels.join('')}</Relationships>`;
    zip.file(drawingRelsPath,drawingRelsXml);

    ctOverrides.push(`<Override PartName="/${drawingPath}" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>`);

    // Update sheet rels
    let sheetRelsXml=zip.file(sheetRelsPath)?await zip.file(sheetRelsPath).async('string'):`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>`;
    const existingIds=[...sheetRelsXml.matchAll(/Id="rId(\d+)"/g)].map(m=>parseInt(m[1]));
    const nextRid='rId'+((existingIds.length?Math.max(...existingIds):0)+1);
    sheetRelsXml=sheetRelsXml.replace('</Relationships>',`<Relationship Id="${nextRid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/drawing${drawingId}.xml"/></Relationships>`);
    zip.file(sheetRelsPath,sheetRelsXml);

    // Add <drawing r:id="..."/> to sheet xml (before </worksheet>, after sheetData/mergeCells/etc.)
    let sheetXml=await zip.file(sheetFile).async('string');
    if(!/<drawing\s/.test(sheetXml)){
      sheetXml=sheetXml.replace('</worksheet>',`<drawing r:id="${nextRid}"/></worksheet>`);
      zip.file(sheetFile,sheetXml);
    }
  }

  // Update [Content_Types].xml
  let ct=await zip.file('[Content_Types].xml').async('string');
  ctOverrides.forEach(o=>{ if(!ct.includes(o)) ct=ct.replace('</Types>',o+'</Types>'); });
  zip.file('[Content_Types].xml',ct);

  return zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

    offset+=local.reduce((a,p)=>a+p.length,0);

function _xmlEsc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function _cellRef(c,r){return _colL(c)+r;}
function _xlsxCell(c,r,v,style){
  const s=style?` s="${style}"`:''; const ref=_cellRef(c,r);
  if(c>1 && style!==2 && typeof v==='string'){
    const cleaned=v.replace(/[$,%\s,]/g,'');
    if(v!=='' && v!=='—' && /^-?\d+(\.\d+)?%?$/.test(v.replace(/[$\s,]/g,'')) && !isNaN(Number(cleaned))) v=Number(cleaned);
  }
  if(typeof v==='number'&&isFinite(v)) return `<c r="${ref}"${s}><v>${v}</v></c>`;
  return `<c r="${ref}" t="inlineStr"${s}><is><t>${_xmlEsc(v)}</t></is></c>`;
}
function _barRowsData(rowsDiv){

}
function _matrixToSheetRows(blocks){
  const rows={}; let maxR=1,maxC=1;
  blocks.forEach(b=>{
    if(b.title){rows[b.row]=rows[b.row]||[];rows[b.row].push(_xlsxCell(1,b.row,b.title,1));maxR=Math.max(maxR,b.row);}
    b.rows.forEach((r,ri)=>r.forEach((v,ci)=>{
      const rr=b.row+(b.title?2:0)+ri, cc=ci+1;
      rows[rr]=rows[rr]||[]; rows[rr].push(_xlsxCell(cc,rr,v,ri===0?2:0)); maxR=Math.max(maxR,rr); maxC=Math.max(maxC,cc);
    }));
  });
  return {xml:Object.keys(rows).sort((a,b)=>a-b).map(r=>`<row r="${r}">${rows[r].join('')}</row>`).join(''),maxR,maxC};
}

      // ── Row 1: Three section titles ──

      const yearLbl=selYear||chartYear;

      const t1=ws2.getCell('A1'); t1.value=`Approved PSW \u2014 ${yearLbl}`;
      t1.font=TITLE_FONT; t1.alignment={vertical:'middle'};

      const t2=ws2.getCell('D1'); t2.value=`Approved PSW \u2014 ${yearLbl} / ${moLbl}`;
      t2.font=TITLE_FONT; t2.alignment={vertical:'middle'};

      const t3=ws2.getCell('G1'); t3.value='Waiting for Approval';
      t3.font=TITLE_FONT; t3.alignment={vertical:'middle'};

      // ── Row 3: Column headers ──
      ws2.getRow(3).height=16;
      const hdrBorder={left:THIN,right:THIN,top:THIN,bottom:MED_BLUE};
      [['A3','CUSTOMER'],['B3','PART NUMBER'],['D3','CUSTOMER'],['E3','PART NUMBER'],['G3','CUSTOMER'],['H3','PART NUMBER']].forEach(([ref,lbl])=>{
        const cell=ws2.getCell(ref); cell.value=lbl;
        cell.font=HDR_FONT; cell.fill=HDR_FILL;
        cell.alignment={horizontal:lbl==='PART NUMBER'?'center':'left',vertical:'middle'};
        cell.border=hdrBorder;
      });

      // ── Data rows ──
      // Col A/B: Approved for selected year
      approvedYearList.forEach((p,i)=>{
        const r=4+i; ws2.getRow(r).height=15;
        const cA=ws2.getCell(r,1); cA.value=getCustName(p); cA.font={name:'Arial',size:10}; cA.alignment={horizontal:'left',vertical:'middle'}; cA.border={left:THIN,right:THIN,top:THIN,bottom:THIN};
        const cB=ws2.getCell(r,2); cB.value=p.pn||''; cB.font={name:'Arial',size:10}; cB.alignment={horizontal:'center',vertical:'middle'}; cB.border={left:THIN,right:THIN,top:THIN,bottom:THIN};
      });

      // Col D/E: Approved for selected year+month
      approvedList.forEach((p,i)=>{
        const r=4+i; ws2.getRow(r).height=15;
        const cD=ws2.getCell(r,4); cD.value=getCustName(p); cD.font={name:'Arial',size:10}; cD.alignment={horizontal:'left',vertical:'middle'}; cD.border={left:THIN,right:THIN,top:THIN,bottom:THIN};
        const cE=ws2.getCell(r,5); cE.value=p.pn||''; cE.font={name:'Arial',size:10}; cE.alignment={horizontal:'center',vertical:'middle'}; cE.border={left:THIN,right:THIN,top:THIN,bottom:THIN};
      });

      // Col G/H: Waiting for Approval
      waitingList.forEach((p,i)=>{
        const r=4+i; ws2.getRow(r).height=15;
        const cG=ws2.getCell(r,7); cG.value=getCustName(p); cG.font={name:'Arial',size:10}; cG.alignment={horizontal:'left',vertical:'middle'}; cG.border={left:THIN,right:THIN,top:THIN,bottom:THIN};
        const cH=ws2.getCell(r,8); cH.value=p.pn||''; cH.font={name:'Arial',size:10}; cH.alignment={horizontal:'center',vertical:'middle'}; cH.border={left:THIN,right:THIN,top:THIN,bottom:THIN};
      });

      // ── Write → inject charts (PSW bar) → download ──
      const buf=await wb.xlsx.writeBuffer();

      // Build chart XML using exact template style
      function _buildPswBarXml(spec){
        const ttl=(spec.title||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
        const titleXml=`<c:title><c:tx><c:rich><a:bodyPr/><a:lstStyle/><a:p><a:r><a:rPr lang="en-US" sz="1200" b="1"/><a:t>${ttl}</a:t></a:r></a:p></c:rich></c:tx><c:overlay val="0"/></c:title><c:autoTitleDeleted val="0"/>`;
        const legendXml=`<c:legend><c:legendPos val="${spec.legendPos||'b'}"/><c:overlay val="0"/></c:legend>`;
        const catTickMajor=spec.catTickMajor||'none';
        const catTickMinor=spec.catTickMinor||'none';
        const valTickMajor=spec.valTickMajor||'cross';
        const valTickMinor=spec.valTickMinor||'none';
        const gap=spec.gapWidth||150;
        const serNameXml=spec.seriesNameRef?`<c:tx><c:strRef><c:f>${spec.seriesNameRef}</c:f></c:strRef></c:tx>`:'';
        return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`+
          `<c:chartSpace xmlns:c="http://schemas.openxmlformats.org/drawingml/2006/chart" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">`+
          `<c:date1904 val="0"/><c:lang val="en-US"/><c:roundedCorners val="1"/><c:style val="2"/>`+
          `<c:chart>${titleXml}<c:plotArea><c:layout/>`+
          `<c:barChart><c:barDir val="col"/><c:grouping val="clustered"/><c:varyColors val="1"/>`+
          `<c:ser><c:idx val="0"/><c:order val="0"/>${serNameXml}`+
          `<c:spPr><a:solidFill><a:srgbClr val="2563EB"/></a:solidFill></c:spPr>`+
          `<c:invertIfNegative val="0"/>`+
          `<c:dLbls><c:spPr><a:noFill/><a:ln><a:noFill/></a:ln><a:effectLst/></c:spPr>`+
          `<c:dLblPos val="outEnd"/><c:showLegendKey val="0"/><c:showVal val="1"/>`+
          `<c:showCatName val="0"/><c:showSerName val="0"/><c:showPercent val="0"/>`+
          `<c:showBubbleSize val="0"/><c:showLeaderLines val="0"/></c:dLbls>`+
          `<c:cat><c:strRef><c:f>${spec.catRange}</c:f></c:strRef></c:cat>`+
          `<c:val><c:numRef><c:f>${spec.valRange}</c:f></c:numRef></c:val>`+
          `</c:ser>`+
          `<c:dLbls><c:dLblPos val="outEnd"/><c:showLegendKey val="0"/><c:showVal val="1"/>`+
          `<c:showCatName val="0"/><c:showSerName val="0"/><c:showPercent val="0"/><c:showBubbleSize val="0"/></c:dLbls>`+
          `<c:gapWidth val="${gap}"/><c:axId val="1"/><c:axId val="2"/></c:barChart>`+
          `<c:catAx><c:axId val="1"/><c:scaling><c:orientation val="minMax"/></c:scaling>`+
          `<c:delete val="0"/><c:axPos val="b"/><c:numFmt formatCode="General" sourceLinked="1"/>`+
          `<c:majorTickMark val="${catTickMajor}"/><c:minorTickMark val="${catTickMinor}"/>`+
          `<c:tickLblPos val="nextTo"/><c:spPr><a:ln/></c:spPr>`+
          `<c:crossAx val="2"/><c:crosses val="autoZero"/><c:auto val="1"/>`+
          `<c:lblAlgn val="ctr"/><c:lblOffset val="100"/><c:noMultiLvlLbl val="1"/></c:catAx>`+
          `<c:valAx><c:axId val="2"/><c:scaling><c:orientation val="minMax"/></c:scaling>`+
          `<c:delete val="0"/><c:axPos val="l"/><c:numFmt formatCode="General" sourceLinked="1"/>`+
          `<c:majorTickMark val="${valTickMajor}"/><c:minorTickMark val="${valTickMinor}"/>`+
          `<c:tickLblPos val="nextTo"/><c:spPr><a:ln/></c:spPr>`+
          `<c:crossAx val="1"/><c:crosses val="autoZero"/><c:crossBetween val="between"/></c:valAx>`+
          `<c:spPr><a:noFill/><a:ln w="25400"><a:noFill/></a:ln></c:spPr>`+
          `</c:plotArea>${legendXml}<c:plotVisOnly val="1"/><c:dispBlanksAs val="zero"/><c:showDLblsOverMax val="1"/></c:chart>`+
          `<c:printSettings><c:headerFooter/><c:pageMargins b="0.75" l="0.7" r="0.7" t="0.75" header="0.3" footer="0.3"/><c:pageSetup/></c:printSettings>`+
          `</c:chartSpace>`;
      }

      // Inject charts
      const zip=await JSZip.loadAsync(buf);
      const wbXml=await zip.file('xl/workbook.xml').async('string');
      const wbRels=await zip.file('xl/_rels/workbook.xml.rels').async('string');
      const sheets=[...wbXml.matchAll(/<sheet\b([^>]*)\/>/g)].map(m=>{
        const a=m[1];
        return {name:(a.match(/name="([^"]+)"/) ||[])[1]||'',rid:(a.match(/r:id="([^"]+)"/) ||[])[1]||''};
      });
      const relMap={};
      [...wbRels.matchAll(/<Relationship[^>]*Id="([^"]+)"[^>]*Target="([^"]+)"/g)].forEach(m=>relMap[m[1]]=m[2]);

      let chartIdx=1,drawIdx=1; const ctOvr=[];
      for(const sn of Object.keys(chartsBySheet)){
        const charts=chartsBySheet[sn]; if(!charts?.length) continue;
        const meta=sheets.find(s=>s.name===sn); if(!meta) continue;
        const sp='xl/'+relMap[meta.rid].replace(/^\//,'');
        const srp=sp.replace('worksheets/','worksheets/_rels/')+'.rels';
        const dId=drawIdx++, dp=`xl/drawings/drawing${dId}.xml`, drp=`xl/drawings/_rels/drawing${dId}.xml.rels`;
        const anchors=[],dRels=[];
        charts.forEach((c,i)=>{
          const cId=chartIdx++, cp=`xl/charts/chart${cId}.xml`, rId=`rId${i+1}`;
          // Build chart XML based on type
          const chartXml=_buildPswBarXml(c);
          zip.file(cp,chartXml);
          dRels.push(`<Relationship Id="${rId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/chart" Target="../charts/chart${cId}.xml"/>`);
          ctOvr.push(`<Override PartName="/${cp}" ContentType="application/vnd.openxmlformats-officedocument.drawingml.chart+xml"/>`);
          const a=c.anchor;
          anchors.push(`<xdr:twoCellAnchor editAs="oneCell"><xdr:from><xdr:col>${a.fromCol}</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>${a.fromRow}</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:from><xdr:to><xdr:col>${a.toCol}</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>${a.toRow}</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:to><xdr:graphicFrame macro=""><xdr:nvGraphicFramePr><xdr:cNvPr id="${i+2}" name="Chart ${cId}"/><xdr:cNvGraphicFramePr/></xdr:nvGraphicFramePr><xdr:xfrm><a:off x="0" y="0"/><a:ext cx="5486400" cy="3200400"/></xdr:xfrm><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/chart"><c:chart xmlns:c="http://schemas.openxmlformats.org/drawingml/2006/chart" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" r:id="${rId}"/></a:graphicData></a:graphic></xdr:graphicFrame><xdr:clientData/></xdr:twoCellAnchor>`);
        });
        zip.file(dp,`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">${anchors.join('')}</xdr:wsDr>`);
        zip.file(drp,`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${dRels.join('')}</Relationships>`);
        ctOvr.push(`<Override PartName="/${dp}" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>`);
        let srXml=zip.file(srp)?await zip.file(srp).async('string'):`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>`;
        const maxId=Math.max(0,...[...srXml.matchAll(/Id="rId(\d+)"/g)].map(m=>parseInt(m[1])));
        const nrId=`rId${maxId+1}`;
        srXml=srXml.replace('</Relationships>',`<Relationship Id="${nrId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/drawing${dId}.xml"/></Relationships>`);
        zip.file(srp,srXml);
        let sXml=await zip.file(sp).async('string');
        if(!/<drawing/.test(sXml)){sXml=sXml.replace('</worksheet>',`<drawing r:id="${nrId}"/></worksheet>`);zip.file(sp,sXml);}
      }
      let ct=await zip.file('[Content_Types].xml').async('string');
      ctOvr.forEach(o=>{if(!ct.includes(o))ct=ct.replace('</Types>',o+'</Types>');});
      zip.file('[Content_Types].xml',ct);
      const finalBlob=await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      const url=URL.createObjectURL(finalBlob);
      const a=document.createElement('a'); a.href=url; a.download=fname; document.body.appendChild(a); a.click();
      setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},800);
    }
  }catch(e){
    console.error('xlsx export failed',e);
    alert('Excel export failed: '+(e&&e.message?e.message:e));
  }
}
function buildSalesReport(allYears, allCusts){
  const isAll = _rptSalesYear === 'all';
  const yr = isAll ? null : (parseInt(_rptSalesYear)||new Date().getFullYear());

  const shipped = DB.samples.filter(s=>{
    if(!s.shippedDate)return false;
    if(isAll)return true;
    const d=parseDt(s.shippedDate);
    return d && d.getFullYear()===yr;
  });

  // KPI widgets
  const totalQty = shipped.reduce((a,s)=>a+(s.shipQty||0),0);
  const totalProjects = new Set(shipped.map(s=>s.pn)).size;
  const totalSales = shipped.reduce((a,s)=>a+(s.sellingPriceUSD||0),0);

  const yearOpts = `<option value="all" ${_rptSalesYear==='all'?'selected':''}>All Years</option>`
    + allYears.map(y=>`<option value="${y}" ${String(y)===_rptSalesYear?'selected':''}>${y}</option>`).join('');

  const fmtNum = n => n.toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:0});
  const fmtUSD = n => '$'+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  const thStyle = `text-align:center;background:linear-gradient(180deg,#F4F7FC,#EAF0FA);border-bottom:1.5px solid var(--border2);padding:4px 6px;font-size:8.5px;font-weight:700;color:var(--muted);white-space:nowrap`;

  // Build table columns — months if specific year, years if All Years
  let colHeaders, colQty, colProj, colRev, tableTitle, chartTitle;
  if(isAll){
    // Group by year
    const yrs = allYears.length ? allYears : [...new Set(shipped.map(s=>{const d=parseDt(s.shippedDate);return d?d.getFullYear():null;}).filter(Boolean))].sort();
    const yQty={}; const yProj={}; const yRev={};
    yrs.forEach(y=>{yQty[y]=0;yProj[y]=new Set();yRev[y]=0;});

    colRev     = yrs.map(y=>`<td style="text-align:center;font-size:10.5px;padding:4px 5px;border-bottom:1px solid var(--border)">${(yRev[y]||0)>0?fmtUSD(yRev[y]):'—'}</td>`).join('');
    tableTitle = 'Sales Summary by Year';
    chartTitle = 'Sales by Year — All';
  } else {
    const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

      mRev[m]+=(s.sellingPriceUSD||0);
    });
    colHeaders = months.map(m=>`<th style="${thStyle}">${m}</th>`).join('');
    colQty     = months.map((_,i)=>`<td style="text-align:center;font-size:10.5px;font-weight:600;padding:4px 5px;border-bottom:1px solid var(--border)">${mQty[i]>0?fmtNum(mQty[i]):'—'}</td>`).join('');
    colProj    = months.map((_,i)=>`<td style="text-align:center;font-size:10.5px;padding:4px 5px;border-bottom:1px solid var(--border)">${mProj[i].size>0?mProj[i].size:'—'}</td>`).join('');
    colRev     = months.map((_,i)=>`<td style="text-align:center;font-size:10.5px;padding:4px 5px;border-bottom:1px solid var(--border)">${mRev[i]>0?fmtUSD(mRev[i]):'—'}</td>`).join('');
    tableTitle = `Sales by Month Table — ${yr}`;
    chartTitle = `Sales by Month — ${yr}`;
  }

  const allCustYears = ['all',...new Set(
    DB.samples.filter(s=>s.shippedDate).map(s=>{const d=parseDt(s.shippedDate);return d?d.getFullYear():null;}).filter(Boolean)
  ).values()].map(y=>y==='all'?'<option value="all">All Years</option>':`<option value="${y}" ${String(y)===_rptCustChartYear?'selected':''}>${y}</option>`).join('');

        </div>
      </div>

function drawSales2PieChart(){
  const el = document.getElementById('sales2PieChart'); if(!el) return;
  const shipped = DB.samples.filter(s=>{
    if(!s.shippedDate) return false;
    const d=parseDt(s.shippedDate); if(!d) return false;
    if(_rpt2Year!=='all' && String(d.getFullYear())!==_rpt2Year) return false;
    if(_rpt2Month!=='all' && String(d.getMonth())!==_rpt2Month) return false;
    return true;
  });
  const custRev={};
  shipped.forEach(s=>{ const c=s.customer||'Unknown'; custRev[c]=(custRev[c]||0)+(s.sellingPriceUSD||0); });
  const sorted=Object.entries(custRev).sort((a,b)=>b[1]-a[1]);
  if(!sorted.length) return;

  const labels=sorted.map(e=>e[0]);
  const vals=sorted.map(e=>e[1]);
  const total=vals.reduce((a,b)=>a+b,0);
  const PALETTE=['#E8650A','#B22222','#2563EB','#16A34A','#7C3AED','#0891B2','#DB2777','#D97706','#0D9488','#EA580C','#4F46E5','#65A30D'];

  // Darken a hex color for side faces
  function darken(hex,amt){
    let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    r=Math.max(0,r-amt);g=Math.max(0,g-amt);b=Math.max(0,b-amt);
    return `rgb(${r},${g},${b})`;
  }

  const dpr = window.devicePixelRatio||1;
  const W=el.offsetWidth||500, H=el.offsetHeight||320;
  el.width=W*dpr; el.height=H*dpr;
  el.style.width=W+'px'; el.style.height=H+'px';
  const ctx=el.getContext('2d');
  ctx.scale(dpr,dpr);

  // Ellipse parameters for the 3D pie — bounded so it always fits the canvas
  const depth=Math.min(H*0.13, 28);          // extrusion depth
  const ry=Math.min(W*0.20, (H-depth)*0.38); // vertical radius (flat top face)
  const rx=Math.min(W*0.36, ry*1.8);         // horizontal radius (keep ellipse ratio)
  const cx=W*0.46, cy=ry+8;                  // anchor near top with small padding

  // Compute slice angles
  const slices=[];
  let start=-Math.PI/2 - Math.PI*0.05; // start near top
  vals.forEach((v,i)=>{
    const sweep=(v/total)*Math.PI*2;
    slices.push({start, end:start+sweep, color:PALETTE[i%PALETTE.length], label:labels[i], pct:(v/total*100).toFixed(1)});
    start+=sweep;
  });

  // Helper: point on ellipse
  function ep(angle){ return {x: cx+rx*Math.cos(angle), y: cy+ry*Math.sin(angle)}; }

  // ── Draw extruded SIDES (bottom half only, back-to-front) ──
  // Only slices whose angles pass through the bottom half (π/2 range) get visible sides.
  // We draw sides for segments ordered so back slices draw first.
  // Sort by the midpoint angle — draw slices whose mid is near π first (top of bottom-half = far away)
  const bottomSlices = slices.map((s,i)=>({...s,i})).filter(s=>{
    // A slice shows a side if any part of it is in [0,π] (bottom of ellipse = front)
    return !(s.end < 0 || s.start > Math.PI);
  }).sort((a,b)=>{
    const ma=((a.start+a.end)/2+Math.PI*4)%(Math.PI*2);
    const mb=((b.start+b.end)/2+Math.PI*4)%(Math.PI*2);
    return mb-ma;
  });

  bottomSlices.forEach(s=>{
    const dark=darken(s.color,55);
    // Clamp to visible bottom arc
    const a0=Math.max(s.start, 0);
    const a1=Math.min(s.end, Math.PI);
    if(a1<=a0) return;

    ctx.beginPath();
    const p0=ep(a0);
    ctx.moveTo(p0.x, p0.y);
    // arc along top ellipse edge
    ctx.save();
    ctx.translate(cx,cy);
    ctx.scale(1, ry/rx);
    ctx.arc(0,0,rx,a0,a1);
    ctx.restore();
    const p1=ep(a1);
    ctx.lineTo(p1.x, p1.y+depth);
    // arc along bottom ellipse edge (reversed)
    ctx.save();
    ctx.translate(cx,cy+depth);
    ctx.scale(1,ry/rx);
    ctx.arc(0,0,rx,a1,a0,true);
    ctx.restore();
    ctx.closePath();
    ctx.fillStyle=dark;
    ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.15)';
    ctx.lineWidth=0.5;
    ctx.stroke();
  });

  // ── Draw top ellipse faces ──
  slices.forEach(s=>{
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.save();
    ctx.translate(cx,cy);
    ctx.scale(1,ry/rx);
    ctx.arc(0,0,rx,s.start,s.end);
    ctx.restore();
    ctx.closePath();
    ctx.fillStyle=s.color;
    ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.9)';
    ctx.lineWidth=2;
    ctx.stroke();
  });

  // ── Draw labels on top face ──
  slices.forEach(s=>{
    if((s.end-s.start)<0.15) return; // skip tiny slices
    const mid=(s.start+s.end)/2;
    const r=rx*0.62;
    const lx=cx+r*Math.cos(mid);
    const ly=cy+ry/rx*r*Math.sin(mid);
    const pct=parseFloat(s.pct);

    ctx.save();
    ctx.shadowColor='rgba(0,0,0,0.45)';
    ctx.shadowBlur=3;

    // Customer name
    if(pct>6){
      ctx.font=`bold ${Math.max(10,Math.min(13,W/38))}px sans-serif`;
      ctx.fillStyle='#fff';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText(s.label.length>12?s.label.slice(0,11)+'…':s.label, lx, ly-8);
    }
    // Percentage
    ctx.font=`bold ${Math.max(11,Math.min(15,W/32))}px sans-serif`;
    ctx.fillStyle='#fff';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(s.pct+'%', lx, pct>6?ly+8:ly);
    ctx.restore();
  });
}


function buildPswReport(){
  const parts = DB.parts;
  const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // Approved = Accept or Conditional Accept
  const isApproved = p => ['Accept','Conditional Accept'].includes(p.ppap?.pswStatus);
  const isInProgress = p => p.ppap?.pswStatus === 'In Progress';

  // All years from pswDate
  const allYears=[...new Set(parts.map(p=>{const d=parseDt(p.pswDate||'');return d?d.getFullYear():null;}).filter(Boolean))].sort();
  if(!_pswRptYear && allYears.length) _pswRptYear=String(allYears[allYears.length-1]);

  const selYear = _pswRptYear?parseInt(_pswRptYear):null;
  // Available months in selected year
  const availMonths = selYear?[...new Set(parts.filter(p=>{const d=parseDt(p.pswDate||'');return d&&d.getFullYear()===selYear&&isApproved(p);}).map(p=>parseDt(p.pswDate).getMonth()))].sort((a,b)=>a-b):[];
  if(_pswRptMonth&&!availMonths.includes(parseInt(_pswRptMonth)))_pswRptMonth='';
  const selMonth=_pswRptMonth!==''?parseInt(_pswRptMonth):null;

  const yearOpts=`<option value="">All</option>`+allYears.map(y=>`<option value="${y}" ${String(y)===_pswRptYear?'selected':''}>${y}</option>`).join('');
  const monthOpts=`<option value="">All</option>`+availMonths.map(m=>`<option value="${m}" ${String(m)===_pswRptMonth?'selected':''}>${MONTHS[m]}</option>`).join('');

  // ── By Year table data ──
  const byYear={};
  allYears.forEach(y=>byYear[y]=0);
  parts.forEach(p=>{const d=parseDt(p.pswDate||'');if(d&&isApproved(p))byYear[d.getFullYear()]=(byYear[d.getFullYear()]||0)+1;});
  const yearTblHdr=allYears.map(y=>`<th style="text-align:center;padding:4px 8px;font-size:8.5px;font-weight:700;color:var(--muted);background:linear-gradient(180deg,#F4F7FC,#EAF0FA);border-bottom:1.5px solid var(--border2)">${y}</th>`).join('');
  const yearTblVals=allYears.map(y=>`<td style="text-align:center;font-size:11px;font-weight:700;padding:5px 8px;border-bottom:1px solid var(--border)">${byYear[y]||0}</td>`).join('');

  // ── By Month table data (for selected year) ──
  const byMonth=new Array(12).fill(0);
  if(selYear){parts.forEach(p=>{const d=parseDt(p.pswDate||'');if(d&&d.getFullYear()===selYear&&isApproved(p))byMonth[d.getMonth()]++;});}
  const monthTblHdr=MONTHS.map(m=>`<th style="text-align:center;padding:4px 5px;font-size:8.5px;font-weight:700;color:var(--muted);background:linear-gradient(180deg,#F4F7FC,#EAF0FA);border-bottom:1.5px solid var(--border2)">${m}</th>`).join('');
  const monthTblVals=MONTHS.map((_,i)=>`<td style="text-align:center;font-size:11px;font-weight:700;padding:5px 5px;border-bottom:1px solid var(--border)">${byMonth[i]||0}</td>`).join('');

  // ── Waiting for Approval (In-Progress) ──
  const waitingList=parts.filter(p=>p.ppap?.pswStatus==='In Progress');
  const waitingRows=waitingList.map(p=>`<tr>
    <td style="font-size:10px;color:var(--muted);padding:3px 8px">${eH(getCust(p.customerId).name)}</td>
    <td style="font-size:10px;font-weight:700;color:var(--accent);padding:3px 8px">${eH(p.pn)}</td>
  </tr>`).join('');

  // ── Approved that year list (filtered by year & month) ──
  const approvedList=parts.filter(p=>{
    if(!isApproved(p)||!p.pswDate)return false;
    const d=parseDt(p.pswDate);if(!d)return false;
    if(selYear&&d.getFullYear()!==selYear)return false;
    if(selMonth!==null&&d.getMonth()!==selMonth)return false;
    return true;
  });
  const approvedRows=approvedList.map(p=>`<tr>
    <td style="font-size:10px;color:var(--muted);padding:3px 8px">${eH(getCust(p.customerId).name)}</td>
    <td style="font-size:10px;font-weight:700;color:var(--accent);padding:3px 8px">${eH(p.pn)}</td>
  </tr>`).join('');

  // ── Chart canvas IDs ──
  const yearChartId='pswByYearChart2';
  const monthChartId='pswByMonthChart2';

  return `
  <div style="display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 12px;box-shadow:var(--sh);margin-bottom:8px;flex-wrap:wrap">
    <span style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">Filter</span>

// ── Chart renderers ──
function _loadChartJs(cb){
  if(typeof Chart!=='undefined'){cb();return;}
  const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js';
  s.onload=cb;document.head.appendChild(s);
}

// ── Sales Report 2: FA Part Sales bar charts (filtered by Year & Month) ──
function _sales2FilteredShipped(){
  return DB.samples.filter(s=>{
    if(!s.shippedDate) return false;
    const d=parseDt(s.shippedDate); if(!d) return false;
    if(_rpt2Year!=='all' && String(d.getFullYear())!==_rpt2Year) return false;
    if(_rpt2Month!=='all' && String(d.getMonth())!==_rpt2Month) return false;
    return true;
  });
}

function _sales2PartAgg(field){
  const m={};
  _sales2FilteredShipped().forEach(s=>{
    const pn=s.pn||'—';
    m[pn]=(m[pn]||0)+(s[field]||0);
  });
  return Object.entries(m).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
}

function drawSales2PartCostChart(){
  const el=document.getElementById('sales2PartCostChart'); if(!el) return;
  _loadChartJs(()=>{
    const sorted=_sales2PartAgg('sellingPriceUSD');
    if(el._chart) el._chart.destroy();
    if(!sorted.length) return;
    const labels=sorted.map(e=>e[0]);
    const data=sorted.map(e=>e[1]);
    const valueLabelPlugin={
      id:'valueLabelsCost',
      afterDatasetsDraw(chart){
        const {ctx}=chart;
        const meta=chart.getDatasetMeta(0);
        meta.data.forEach((bar,i)=>{
          const v=data[i]; if(!v) return;
          ctx.save();
          ctx.font='bold 8.5px sans-serif';
          ctx.fillStyle='#15803d';
          ctx.textAlign='center';
          const label='$'+(v>=1000?(v/1000).toFixed(1)+'k':v.toFixed(0));
          ctx.fillText(label,bar.x,bar.y-4);
          ctx.restore();
        });
      }
    };
    el._chart=new Chart(el,{
      type:'bar',
      plugins:[valueLabelPlugin],
      data:{labels,datasets:[{
        label:'Sales (USD)',data,
        backgroundColor:'rgba(22,163,74,.65)',borderColor:'rgba(22,163,74,1)',borderWidth:1,borderRadius:3
      }]},
      options:{
        responsive:true,maintainAspectRatio:false,
        layout:{padding:{top:20}},
        plugins:{
          legend:{display:false},
          tooltip:{callbacks:{label:ctx=>'$'+ctx.parsed.y.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}}
        },
        scales:{
          x:{title:{display:true,text:'Part No',font:{size:9}},ticks:{font:{size:9},autoSkip:false,maxRotation:60,minRotation:30}},
          y:{title:{display:true,text:'Sales (USD)',font:{size:9}},ticks:{font:{size:9},callback:v=>'$'+v.toLocaleString()},grid:{color:'rgba(0,0,0,.06)'}}
        }
      }
    });
  });
}

function drawSalesComboChart(){
  const el=document.getElementById('salesComboChart');if(!el)return;
  _loadChartJs(()=>{
    const isAll=_rptSalesYear==='all';
    const yr=parseInt(_rptSalesYear)||new Date().getFullYear();
    let labels, qtyData, revData;

    if(isAll){
      const byYear={};
      DB.samples.forEach(s=>{
        if(!s.shippedDate)return;
        const d=parseDt(s.shippedDate);if(!d)return;
        const y=d.getFullYear();
        if(!byYear[y])byYear[y]={qty:0,rev:0};
        byYear[y].qty+=(s.shipQty||0);
        byYear[y].rev+=(s.sellingPriceUSD||0);
      });
      labels=Object.keys(byYear).sort();
      qtyData=labels.map(y=>byYear[y].qty);
      revData=labels.map(y=>byYear[y].rev);
    } else {
      labels=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      qtyData=new Array(12).fill(0);revData=new Array(12).fill(0);
      DB.samples.forEach(s=>{
        if(!s.shippedDate)return;
        const d=parseDt(s.shippedDate);if(!d||d.getFullYear()!==yr)return;
        const m=d.getMonth();
        qtyData[m]+=(s.shipQty||0);
        revData[m]+=(s.sellingPriceUSD||0);
      });
    }

    // Inline value-label plugin (no CDN dependency)
    const valueLabelPlugin={
      id:'valueLabels',
      afterDatasetsDraw(chart){
        const {ctx}=chart;
        chart.data.datasets.forEach((ds,di)=>{
          const meta=chart.getDatasetMeta(di);
          if(meta.hidden)return;
          meta.data.forEach((el,i)=>{
            const val=ds.data[i];
            if(!val&&val!==0)return;
            ctx.save();
            ctx.font='bold 8.5px sans-serif';
            ctx.textAlign='center';
            if(ds.type==='bar'||ds.type===undefined){
              ctx.fillStyle='rgba(37,99,235,0.9)';
              const y=el.y-4;
              if(val>0) ctx.fillText(val.toLocaleString(),el.x,y);
            } else {
              // line — revenue label
              ctx.fillStyle='#15803d';
              if(val>0){
                const label='$'+(val>=1000?(val/1000).toFixed(1)+'k':val.toFixed(0));
                ctx.fillText(label,el.x,el.y-8);
              }
            }
            ctx.restore();
          });
        });
      }
    };

    if(el._chart)el._chart.destroy();
    el._chart=new Chart(el,{
      plugins:[valueLabelPlugin],
      data:{
        labels,
        datasets:[
          {type:'bar',label:'Ship Qty',data:qtyData,backgroundColor:'rgba(37,99,235,.65)',borderColor:'rgba(37,99,235,1)',borderWidth:1,yAxisID:'y',borderRadius:3},
          {type:'line',label:'Revenue (USD)',data:revData,borderColor:'#16A34A',backgroundColor:'rgba(22,163,74,.10)',pointBackgroundColor:'#16A34A',pointRadius:5,pointHoverRadius:7,tension:.3,yAxisID:'y2',fill:true}
        ]
      },
      options:{
        responsive:true,maintainAspectRatio:false,
        layout:{padding:{top:22}},
        plugins:{
          legend:{position:'top',labels:{font:{size:10},boxWidth:12}},
          tooltip:{callbacks:{label:ctx=>ctx.dataset.yAxisID==='y2'?'$'+ctx.parsed.y.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}):ctx.parsed.y.toLocaleString()+' units'}}
        },
        scales:{
          y:{position:'left',title:{display:true,text:'Ship Qty',font:{size:9}},ticks:{font:{size:9}},grid:{color:'rgba(0,0,0,.06)'}},
          y2:{position:'right',title:{display:true,text:'Revenue (USD)',font:{size:9}},ticks:{font:{size:9},callback:v=>'$'+v.toLocaleString()},grid:{drawOnChartArea:false}}
        }
      }
    });
  });
}

function drawCustBarChart(){
  const el=document.getElementById('custBarRows');if(!el)return;
  const filterYr=_rptCustChartYear==='all'?null:parseInt(_rptCustChartYear);
  const custRev={};
  DB.samples.forEach(s=>{
    if(!s.shippedDate)return;
    const d=parseDt(s.shippedDate);if(!d)return;
    if(filterYr&&d.getFullYear()!==filterYr)return;
    const c=s.customer||'Unknown';
    custRev[c]=(custRev[c]||0)+(s.sellingPriceUSD||0);
  });
  const sorted=Object.entries(custRev).sort((a,b)=>b[1]-a[1]);
  const maxV=sorted[0]?.[1]||1;
  const fmtUSD=n=>'$'+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  if(!sorted.length){el.innerHTML='<div style="padding:12px;text-align:center;color:var(--muted);font-size:11px">No data</div>';return;}

      <div class="cust-count" style="min-width:80px;font-size:9.5px">${fmtUSD(val)}</div>

}

<script>
(function(){
  // Default column widths (px) for 15 columns of Parts Register
  const DEFAULT_WIDTHS=[110,150,110,110,100,90,100,140,80,80,90,80,150,140,80];
  const STORAGE_KEY='npd_parts_col_widths_v1';
  function loadWidths(){try{const v=JSON.parse(localStorage.getItem(STORAGE_KEY));if(Array.isArray(v)&&v.length===DEFAULT_WIDTHS.length)return v;}catch(e){}return DEFAULT_WIDTHS.slice();}
  function saveWidths(w){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(w));}catch(e){}}
  function applyWidths(table,widths){
    let cg=table.querySelector('colgroup');
    if(!cg){cg=document.createElement('colgroup');widths.forEach(w=>{const c=document.createElement('col');c.style.width=w+'px';cg.appendChild(c);});table.insertBefore(cg,table.firstChild);}
    else{[...cg.children].forEach((c,i)=>c.style.width=widths[i]+'px');}
    let total=widths.reduce((a,b)=>a+b,0);
    table.style.minWidth=total+'px';table.style.width=total+'px';
  }
  function attachResizers(table){
    const ths=table.querySelectorAll('thead th');
    let widths=loadWidths();
    if(widths.length!==ths.length){widths=Array.from(ths).map((_,i)=>DEFAULT_WIDTHS[i]||100);}
    applyWidths(table,widths);
    ths.forEach((th,idx)=>{
      if(th.querySelector('.col-resizer'))return;
      const r=document.createElement('div');r.className='col-resizer';
      th.appendChild(r);
      r.addEventListener('mousedown',e=>{
        e.preventDefault();e.stopPropagation();
        r.classList.add('active');
        const startX=e.clientX;const startW=th.getBoundingClientRect().width;
        function mm(ev){
          const nw=Math.max(40,startW+(ev.clientX-startX));
          widths[idx]=Math.round(nw);
          applyWidths(table,widths);
        }
        function mu(){
          document.removeEventListener('mousemove',mm);
          document.removeEventListener('mouseup',mu);
          r.classList.remove('active');
          saveWidths(widths);
        }
        document.addEventListener('mousemove',mm);
        document.addEventListener('mouseup',mu);
      });
    });
  }
  function tryInit(){
    const t=document.getElementById('parts-register-tbl');
    if(t)attachResizers(t);
    const st=document.getElementById('sales-summary-tbl');
    if(st)attachResizers(st);
  }
  // Observe the parts view for re-renders (rdParts replaces innerHTML)
  document.addEventListener('DOMContentLoaded',()=>{
    const vw=document.getElementById('vw-parts');
    if(vw){
      const mo=new MutationObserver(()=>tryInit());
      mo.observe(vw,{childList:true,subtree:true});
    }
    // Observe the report view for sales table re-renders
    const rv=document.getElementById('vw-report');
    if(rv){
      const mo2=new MutationObserver(()=>tryInit());
      mo2.observe(rv,{childList:true,subtree:true});
    }
    tryInit();
  });
})();
</script>
