<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1400">
<title>NPD Project Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#EEF2FA;--card:#fff;--card2:#F4F7FC;--border:#DCE3F2;--border2:#BDCBE8;
  --text:#0F1F3D;--text2:#455A82;--muted:#7B8BAD;--dim:#B0BCCF;
  --accent:#2563EB;--accent2:#0EA5E9;--green:#16A34A;--amber:#D97706;--red:#DC2626;
  --orange:#EA580C;--steel:#3B6FB8;--cyan:#0891B2;--navy:#E5ECFA;--tab-bg:#D8E1F4;
  --grad:linear-gradient(135deg,#2563EB 0%,#0EA5E9 100%);
  --grad-soft:linear-gradient(135deg,#EFF4FE 0%,#E6F1FB 100%);
  --sh:0 1px 3px rgba(20,50,120,.08), 0 1px 2px rgba(20,50,120,.06);
  --sh2:0 4px 14px rgba(20,50,120,.12);
  --sh-glow:0 0 0 3px rgba(37,99,235,.12);
}
html,body{height:100%;overflow:hidden;}
body{font-family:'Inter','Segoe UI',Arial,sans-serif;font-size:12px;background:var(--bg);color:var(--text);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}

/* ── HEADER ── */
#hdr{background:linear-gradient(180deg,#fff 0%,#FAFCFF 100%);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;height:36px;flex-shrink:0;position:relative;z-index:100;box-shadow:var(--sh);}
#hdr::before{content:'';position:absolute;left:0;top:0;width:4px;height:36px;background:var(--grad);}
#sys-title{font-size:12px;font-weight:700;color:transparent;background:var(--grad);-webkit-background-clip:text;background-clip:text;letter-spacing:.05em;margin-left:10px;text-transform:uppercase;}
#hdr-act{margin-left:auto;display:flex;gap:6px;}
.hbtn{padding:4px 11px;border-radius:6px;font-size:10.5px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text2);transition:all .18s ease;}
.hbtn:hover{border-color:var(--accent);color:var(--accent);box-shadow:var(--sh);transform:translateY(-1px);}
.hbtn.pri{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 2px 6px rgba(37,99,235,.28);}
.hbtn.pri:hover{box-shadow:0 4px 12px rgba(37,99,235,.42);transform:translateY(-1px);}

/* ── TABS ── */
#tab-bar{background:var(--navy);border-bottom:1px solid var(--border);display:flex;align-items:flex-end;padding:5px 6px 0;gap:3px;flex-shrink:0;}
.tab{padding:6px 0;flex:1;text-align:center;font-size:10px;font-weight:600;border-radius:6px 6px 0 0;cursor:pointer;color:var(--text2);background:var(--tab-bg);border:1px solid transparent;border-bottom:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .18s ease;position:relative;}
.tab:hover{background:#C8D4EC;color:var(--accent);}
.tab.active{background:#fff;color:var(--accent);border-color:var(--border);box-shadow:0 -2px 6px rgba(20,50,120,.05);}
.tab.active::after{content:'';position:absolute;left:8%;right:8%;bottom:-1px;height:2px;background:var(--grad);border-radius:2px;}

/* ── VIEWS ── */
#views{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0;background:var(--bg);}
.vw{display:none;height:100%;overflow:hidden;flex-direction:column;}
.vw.active{display:flex;}
.tab-scroll{flex:1;overflow-y:auto;padding:8px;}

/* ── DASHBOARD LAYOUT — 3 columns ── */
#dash-wrap{flex:1;overflow:hidden;padding:6px;display:flex;gap:6px;}
#dash-c1{display:flex;flex-direction:column;gap:6px;flex:2;min-width:0;min-height:0;overflow:hidden;}
#dash-c2{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0;min-height:0;overflow:hidden;}
#dash-c3{display:flex;flex-direction:column;gap:6px;width:258px;flex-shrink:0;min-height:0;overflow:hidden;}
.kpi{background:var(--grad);border-radius:8px;padding:6px 10px;flex:1;min-width:0;box-shadow:0 4px 12px rgba(37,99,235,.22);display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;}
.kpi::before{content:'';position:absolute;top:-20px;right:-20px;width:60px;height:60px;background:rgba(255,255,255,.1);border-radius:50%;}
.kpi-lbl{font-size:7.5px;font-weight:700;color:rgba(255,255,255,.88);letter-spacing:.06em;text-transform:uppercase;line-height:1.2;position:relative;}
.kpi-val{font-size:19px;font-weight:800;color:#fff;line-height:1.1;position:relative;}

/* ── CARDS ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:var(--sh);transition:box-shadow .2s ease;}
.card:hover{box-shadow:var(--sh2);}
.ct{font-size:10px;font-weight:700;color:var(--text);letter-spacing:.05em;padding:6px 11px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#FAFCFF 0%,var(--card2) 100%);border-radius:7px 7px 0 0;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:5px;text-transform:uppercase;}
.ac{display:flex;flex-direction:column;flex:1;min-height:0;}
.bc{display:flex;flex-direction:column;flex:1;min-height:0;}
.sp{overflow-y:auto;flex:1;min-height:0;}

/* ── TABLE ── */
.tbl{width:100%;border-collapse:collapse;}
.tbl th{font-size:8.5px;font-weight:700;color:var(--muted);letter-spacing:.05em;padding:5px 6px;text-align:left;background:linear-gradient(180deg,#F4F7FC 0%,#EAF0FA 100%);border-bottom:1.5px solid var(--border2);white-space:nowrap;text-transform:uppercase;position:sticky;top:0;z-index:1;}
.tbl td{font-size:10.5px;padding:4px 6px;border-bottom:1px solid var(--border);vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tbody tr{transition:background .15s ease, box-shadow .15s ease;}
.tbl tbody tr:hover td{background:color-mix(in oklab, var(--accent) 6%, var(--card));}
.tbl tbody tr.sel td{background:color-mix(in oklab, var(--accent) 12%, var(--card));border-bottom-color:color-mix(in oklab, var(--accent) 25%, var(--border));}
.tbl tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent);}

/* ── SEARCHABLE COMBOBOX ── */
.cmb-wrap{position:relative;display:inline-flex;flex-direction:column;min-width:0;}
.cmb-wrap.full{width:100%;}
.cmb-inp{padding:5px 10px;border:1.5px solid var(--border);border-radius:4px;font-size:12px;background:var(--card);color:var(--text);outline:none;width:100%;}
.cmb-inp:focus{border-color:var(--accent);box-shadow:var(--sh-glow);}
.cmb-drop{position:absolute;top:calc(100% + 2px);left:0;right:0;background:var(--card);border:1.5px solid var(--accent);border-radius:6px;box-shadow:var(--sh2);z-index:9999;max-height:220px;overflow-y:auto;display:none;}
.cmb-drop.open{display:block;}
.cmb-opt{padding:6px 10px;font-size:11px;cursor:pointer;color:var(--text);border-bottom:1px solid var(--border);}
.cmb-opt:last-child{border-bottom:none;}
.cmb-opt:hover,.cmb-opt.hi{background:color-mix(in oklab,var(--accent) 10%,var(--card));color:var(--accent);}
.cmb-opt.no-res{color:var(--muted);font-style:italic;cursor:default;}
.cmb-opt.no-res:hover{background:none;color:var(--muted);}
/* ── TICK ALL BUTTON ── */
.btn-tick-all{padding:3px 10px;border-radius:5px;font-size:9.5px;font-weight:700;cursor:pointer;border:1.5px solid var(--green);color:var(--green);background:rgba(22,163,74,.07);transition:all .15s;}
.btn-tick-all:hover{background:var(--green);color:#fff;}
.chip{display:inline-block;padding:1px 6px;border-radius:20px;font-size:9px;font-weight:700;}
.cg{background:#DCFAEB;color:#0E7A38;border:1px solid #A5E8C4;}
.ca{background:#FFF3DC;color:#8A5C00;border:1px solid #F5D88A;}
.cr{background:#FFEAEA;color:#B02020;border:1px solid #F5AAAA;}
.cb{background:#E5F0FF;color:#1351A8;border:1px solid #AACBFF;}
.cd{background:#ECEFF5;color:#5A6A88;border:1px solid #C8D4E8;}
.cp{background:#F0EAFF;color:#6A30C8;border:1px solid #C8AAFF;}
.co{background:#FFF0E5;color:#8A3500;border:1px solid #F5C8AA;}

/* ── PBAR ── */
.pb-wrap{background:var(--border);border-radius:4px;overflow:hidden;}
.pb-fill{height:100%;border-radius:4px;transition:width .3s;}

/* ── PHASE DOTS (horizontal bar segments) ── */
.pdots{display:flex;gap:2px;}
.pdot{width:10px;height:5px;border-radius:2px;}

/* ── CALENDAR ── */
#cal-nav{display:flex;align-items:center;justify-content:space-between;padding:3px 6px;background:var(--card2);border-bottom:1px solid var(--border);}
#cal-nav button{background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;font-weight:700;padding:0 2px;line-height:1;}
#cal-month-lbl{font-size:9px;font-weight:700;color:var(--text2);}
#cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;padding:2px 4px;}
.cal-dh{text-align:center;font-size:7.5px;font-weight:700;color:var(--muted);}
.cal-day{position:relative;text-align:center;font-size:9px;padding:1px;border-radius:3px;color:var(--text2);}
.cal-day.td{background:var(--accent);color:#fff;font-weight:700;border-radius:50%;}
.cal-day.we{color:var(--amber);}
.cal-day.em{opacity:0;pointer-events:none;}
.cal-day.has-etd{background:#E5F5FF;color:var(--cyan);font-weight:700;border:1px solid var(--cyan);border-radius:3px;cursor:pointer;}
.cal-tt{display:none;position:absolute;z-index:60;background:#1A2340;color:#fff;font-size:8.5px;border-radius:4px;padding:3px 6px;min-width:90px;max-width:150px;top:calc(100% + 2px);left:50%;transform:translateX(-50%);box-shadow:0 3px 8px rgba(0,0,0,.3);white-space:normal;line-height:1.4;pointer-events:none;}
.cal-day:hover .cal-tt{display:block;}

/* ── CUSTOMER CHART (horizontal bar) ── */
.cust-bar-row{display:flex;align-items:center;gap:6px;padding:3px 8px;border-bottom:1px solid var(--border);}
.cust-bar-row:last-child{border-bottom:none;}
.cust-name{font-size:10px;color:var(--text2);width:72px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cust-bar{flex:1;height:14px;background:var(--border);border-radius:3px;overflow:hidden;}
.cust-bar-fill{height:100%;background:var(--accent);border-radius:3px;}
.cust-count{font-size:10px;font-weight:700;color:var(--text);min-width:20px;text-align:right;}

/* ── APQP PHASE CHECKLIST ── */
.ci-files{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;margin-left:22px;}
.ci-file-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:10px;font-size:9px;font-weight:600;background:var(--card2);border:1px solid var(--border);color:var(--accent);cursor:pointer;transition:all .12s;}
.ci-file-chip:hover{background:var(--accent);color:#fff;}
.ci-file-chip .del-f{color:var(--red);font-size:10px;margin-left:2px;cursor:pointer;font-weight:700;}
.ci-file-chip .del-f:hover{color:#fff;}
.ci-upload-btn{padding:2px 8px;border-radius:4px;font-size:9px;font-weight:600;cursor:pointer;border:1.5px dashed var(--border);background:transparent;color:var(--muted);transition:all .12s;white-space:nowrap;}
.ci-upload-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--card2);}
/* ── APQP PHASE CHECKLIST ── */
.phase-block{background:var(--card);border:1.5px solid var(--border);border-radius:6px;margin-bottom:7px;overflow:hidden;}
.phase-hdr{display:grid;grid-template-columns:1fr 100px 44px;align-items:center;gap:8px;padding:6px 10px;background:var(--card2);border-bottom:1px solid var(--border);cursor:pointer;user-select:none;}
.phase-hdr:hover{background:#E8EEFA;}
.phase-title{font-size:11px;font-weight:700;}
.phase-pct-lbl{font-size:11px;font-weight:700;text-align:right;}
.ci-row{display:grid;grid-template-columns:18px 1fr 115px 115px 80px;align-items:center;gap:5px;padding:4px 10px;border-bottom:1px solid var(--border);}
.ci-row:last-child{border-bottom:none;}
.ci-row:hover{background:#F5F8FF;}
.ci-cb{width:13px;height:13px;cursor:pointer;accent-color:var(--accent);}
.ci-lbl{font-size:10.5px;}
.ci-lbl.na{color:var(--dim);font-style:italic;}
.ci-din{font-size:10px;padding:2px 5px;border:1.5px solid var(--border);border-radius:3px;width:100%;color:var(--text);background:var(--bg);}
.ci-din:focus{border-color:var(--accent);outline:none;background:#fff;}
.ci-din.filled{border-color:var(--green);background:#F0FFF6;color:var(--green);font-weight:600;}
.ci-status{font-size:9px;font-weight:700;text-align:center;}

/* ── PPAP ── */
.ppap-item{display:grid;grid-template-columns:18px 1fr 38px;align-items:center;gap:5px;padding:3px 9px;border-bottom:1px solid var(--border);}
.ppap-item:last-child{border-bottom:none;}
.ppap-item:hover{background:#F5F8FF;}
.ppap-cb{width:13px;height:13px;cursor:pointer;accent-color:var(--accent);}
.psw-section{border-top:2px solid var(--accent);margin-top:7px;padding-top:5px;}
.psw-field{display:flex;align-items:center;gap:7px;padding:3px 9px;border-bottom:1px solid var(--border);}
.psw-field label{font-size:8.5px;font-weight:700;color:var(--muted);width:105px;flex-shrink:0;text-transform:uppercase;}
.psw-field select,.psw-field input{flex:1;padding:3px 6px;border:1.5px solid var(--border);border-radius:3px;font-size:10.5px;color:var(--text);background:var(--bg);}
.psw-field select:focus,.psw-field input:focus{border-color:var(--accent);outline:none;background:#fff;}

/* ── MODAL ── */
#mo{display:none;position:fixed;inset:0;background:rgba(16,30,70,.38);z-index:200;align-items:flex-start;justify-content:center;padding:20px 12px;overflow-y:auto;}
#mo.open{display:flex;}
#mdl{background:var(--card);border-radius:9px;min-width:620px;max-width:920px;width:100%;box-shadow:0 8px 40px rgba(16,30,70,.22);border:1.5px solid var(--border);margin-bottom:20px;}
#mdl-hdr{background:var(--accent);padding:9px 14px;border-radius:8px 8px 0 0;display:flex;justify-content:space-between;align-items:center;}
#mdl-title{font-size:12.5px;font-weight:700;color:#fff;}
#mdl-x{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;opacity:.8;line-height:1;}
#mdl-body{padding:12px 14px;max-height:calc(100vh - 120px);overflow-y:auto;}
#mdl-foot{padding:8px 14px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:6px;background:var(--card2);border-radius:0 0 8px 8px;}

/* ── FORM ── */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;}
.fg .full{grid-column:1/-1;}
.fld{display:flex;flex-direction:column;gap:2px;}
.fld label{font-size:8.5px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;}
.fld input,.fld select,.fld textarea{width:100%;padding:4px 7px;border:1.5px solid var(--border);border-radius:4px;font-size:11.5px;color:var(--text);background:var(--bg);font-family:inherit;}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);outline:none;background:#fff;}
.fld textarea{resize:vertical;min-height:40px;}
.fld input.has-val{border-color:var(--green);background:#F0FFF6;}

/* ── OP TABLE ── */
#op-tbl{width:100%;border-collapse:collapse;margin-top:4px;}
#op-tbl th{font-size:8.5px;color:var(--muted);font-weight:700;padding:2px 5px;background:var(--card2);border-bottom:1.5px solid var(--border2);text-align:left;white-space:nowrap;}
#op-tbl td{padding:2px 3px;border-bottom:1px solid var(--border);vertical-align:middle;}
#op-tbl select,#op-tbl input{width:100%;padding:2px 4px;border:1.5px solid var(--border);border-radius:3px;font-size:11px;color:var(--text);background:var(--bg);}
#op-tbl select option{background:var(--card);color:var(--text);}
#op-tbl select:focus,#op-tbl input:focus{border-color:var(--accent);outline:none;}
.op-rm{border:none;background:none;color:var(--red);cursor:pointer;font-size:12px;font-weight:700;padding:0 2px;}

/* ── PROC STAGE (sample build modal) ── */
.proc-stage{border:1.5px solid var(--border);border-radius:5px;margin-bottom:5px;overflow:hidden;}
.proc-stage-hdr{background:var(--card2);padding:4px 9px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);}
.proc-stage-body{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;padding:7px 9px;}

/* ── BTNs ── */
.btn{padding:4px 13px;border-radius:4px;font-size:11.5px;font-weight:600;cursor:pointer;border:none;}
.btn-p{background:var(--accent);color:#fff;}.btn-p:hover{background:#155fc0;}
.btn-s{background:var(--card2);color:var(--text2);border:1.5px solid var(--border);}.btn-s:hover{border-color:var(--accent);color:var(--accent);}
.btn-d{background:var(--red);color:#fff;border:none;padding:2px 7px;border-radius:3px;font-size:9.5px;cursor:pointer;font-weight:600;}
.btn-d:hover{background:#A02020;}
.btn-e{background:var(--card2);color:var(--accent);border:1.5px solid var(--accent);padding:2px 7px;border-radius:3px;font-size:9.5px;cursor:pointer;font-weight:600;}
.btn-e:hover{background:var(--accent);color:#fff;}
.btn-ship{background:var(--green);color:#fff;border:none;padding:2px 9px;border-radius:3px;font-size:9.5px;cursor:pointer;font-weight:600;}
.btn-ship:hover{background:#0E7A38;}
.btn-sm{padding:2px 7px;border-radius:3px;font-size:9.5px;cursor:pointer;font-weight:600;border:1.5px solid;}
.btn-ci{border-color:var(--amber);color:var(--amber);background:rgba(184,126,0,.07);}
.btn-ci:hover{background:var(--amber);color:#fff;}
.btn-ro{border-color:var(--green);color:var(--green);background:rgba(23,155,80,.07);}
.btn-ro:hover{background:var(--green);color:#fff;}
.btn-addop{padding:3px 10px;border-radius:4px;font-size:10px;font-weight:600;cursor:pointer;background:var(--card2);color:var(--accent);border:1.5px solid var(--accent);margin-top:4px;}
.btn-addop:hover{background:var(--accent);color:#fff;}

/* ── REGISTRY ── */
.reg-sec{background:var(--card);border:1.5px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:8px;}
.reg-hdr{background:var(--card2);border-bottom:1.5px solid var(--border);padding:5px 9px;display:flex;align-items:center;justify-content:space-between;}
.reg-hdr span{font-size:9.5px;font-weight:700;color:var(--text2);letter-spacing:.05em;text-transform:uppercase;}
.reg-add{display:flex;gap:6px;padding:6px 9px;border-bottom:1px solid var(--border);background:#F8FAFD;align-items:flex-end;flex-wrap:wrap;}
.reg-add .fld{flex:1;min-width:100px;}
.il-in{border:none;background:transparent;font-size:10.5px;color:var(--text);width:100%;padding:1px 2px;}
.il-in:focus{border-bottom:1.5px solid var(--accent);outline:none;background:#fff;}

/* ── PARTS TABLE (scrollable) ── */
.parts-wrap{overflow-x:auto;overflow-y:auto;flex:1;}
/* Resizable columns for Parts Register */
.tbl-resizable{table-layout:fixed;}
.tbl-resizable th{position:relative;overflow:hidden;text-overflow:ellipsis;}
.tbl-resizable td{overflow:hidden;text-overflow:ellipsis;}
.col-resizer{position:absolute;top:0;right:0;width:6px;height:100%;cursor:col-resize;user-select:none;z-index:5;}
.col-resizer:hover,.col-resizer.active{background:var(--accent);opacity:.5;}


/* ── GANTT ── */
.gantt-info{padding:6px 10px;background:var(--card2);border-bottom:1.5px solid var(--border);display:flex;flex-wrap:wrap;gap:8px 20px;}
.gantt-info-item{display:flex;flex-direction:column;gap:1px;}
.gantt-info-item label{font-size:7.5px;font-weight:700;color:var(--muted);text-transform:uppercase;}
.gantt-info-item span{font-size:10.5px;font-weight:600;color:var(--text);}
.gantt-legend{display:flex;gap:10px;padding:3px 10px;background:var(--bg);border-bottom:1px solid var(--border);font-size:8.5px;color:var(--muted);}
.gantt-legend span{display:flex;align-items:center;gap:3px;}
.gantt-legend .leg-box{width:12px;height:7px;border-radius:2px;display:inline-block;}
.gantt-wrap{overflow-x:auto;overflow-y:auto;flex:1;min-height:0;position:relative;}
.g-tbl thead th{position:sticky;background:var(--card2);}
.g-tbl{border-collapse:collapse;min-width:100%;table-layout:fixed;}
.g-tbl th,.g-tbl td{border:1px solid var(--border);vertical-align:middle;}
.g-tbl th{background:var(--card2);color:var(--text2);font-size:8.5px;font-weight:700;text-align:center;padding:2px 3px;white-space:nowrap;}
.g-tbl td{background:var(--card);font-size:10px;padding:2px 5px;}
.g-lbl{font-size:10px;color:var(--text);min-width:100px;padding:2px 6px;white-space:nowrap;}

.g-cell.weekend{background:#F4F6FB;}
/* Gantt bars — centered pair with minimal gap */
/* Cell height = 18px; total bars = 5+2+5 = 12px centered → top_plan = (18-12)/2 = 3px, top_actual = 3+5+2 = 10px */
.g-bar-plan{position:absolute;left:0;right:0;top:3px;height:8px;
  background:linear-gradient(90deg,#3B82F6,#22D3EE);
  border:1px solid #1E40AF;
  border-radius:3px;pointer-events:none;
  box-shadow:0 0 8px rgba(59,130,246,.55), inset 0 1px 0 rgba(255,255,255,.45);
  overflow:hidden;}
.g-bar-plan::after{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(45deg, rgba(255,255,255,.22) 0 4px, transparent 4px 8px);
  animation:gFlow 1.6s linear infinite;}
.g-bar-actual{position:absolute;left:0;right:0;top:3px;height:8px;
  background:linear-gradient(90deg,#10B981,#34D399);
  border:1px solid #047857;
  border-radius:3px;pointer-events:none;
  box-shadow:0 0 8px rgba(16,185,129,.55), inset 0 1px 0 rgba(255,255,255,.45);
  overflow:hidden;}
.g-bar-actual::after{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(45deg, rgba(255,255,255,.22) 0 4px, transparent 4px 8px);
  animation:gFlow 1.6s linear infinite reverse;}
.g-bar-delay{background:linear-gradient(90deg,#EF4444,#F87171)!important;
  border-color:#991B1B!important;
  box-shadow:0 0 10px rgba(239,68,68,.65), inset 0 1px 0 rgba(255,255,255,.45)!important;}
/* Center separator line - subtle midline between the two bars */
.g-cell::before{content:'';position:absolute;left:0;right:0;top:9px;height:1px;background:rgba(148,163,184,.18);pointer-events:none;}
@keyframes gFlow{from{background-position:0 0}to{background-position:24px 0}}
.g-marker-start{position:absolute;top:0;bottom:0;left:50%;width:2px;background:linear-gradient(180deg,#22D3EE,#0EA5E9);z-index:3;box-shadow:0 0 6px #22D3EE;border-radius:1px;transform:translateX(-1px);}
.g-marker-etd{position:absolute;top:0;bottom:0;left:50%;width:2px;background:linear-gradient(180deg,#F87171,#DC2626);z-index:3;box-shadow:0 0 6px #F87171;border-radius:1px;transform:translateX(-1px);}
.g-bar-span-wrap{position:relative;height:22px;}
body.dark .g-cell::before{background:rgba(148,163,184,.18);}

/* ── ISS KPI ── */
.iss-kpi{padding:5px 8px;border-radius:5px;border-left:4px solid;min-width:80px;}

<script>
// ════════════════════════════════════════════════════════
//  DATE UTILS
// ════════════════════════════════════════════════════════
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MNF=['January','February','March','April','May','June','July','August','September','October','November','December'];
function fmtDate(raw){
  if(!raw)return '';
  raw=raw.trim();
  if(/^\d{1,2}-[A-Za-z]{3}-\d{2}$/.test(raw)){
    const p=raw.split('-');const m=MN.findIndex(x=>x.toLowerCase()===p[1].toLowerCase());
    if(m>=0)return `${p[0]}-${MN[m]}-${p[2]}`;
  }
  const sep=raw.includes('/')? '/':'-';
  const p=raw.split(sep);
  if(p.length===3){
    const d=parseInt(p[0]),m=parseInt(p[1])-1;let y=parseInt(p[2]);
    if(y>100)y=y%100;
    if(!isNaN(d)&&m>=0&&m<12)return `${d}-${MN[m]}-${String(y).padStart(2,'0')}`;
  }
  return raw;
}
function parseDt(s){
  if(!s)return null;
  const m=/^(\d{1,2})-([A-Za-z]{3})-(\d{2})$/.exec(s.trim());
  if(!m)return null;
  const mon=MN.findIndex(x=>x.toLowerCase()===m[2].toLowerCase());
  if(mon<0)return null;
  return new Date(2000+parseInt(m[3]),mon,parseInt(m[1]));
}
function todayFmt(){const n=new Date();return `${n.getDate()}-${MN[n.getMonth()]}-${String(n.getFullYear()).slice(-2)}`;}
function bindDates(root){
  (root||document).querySelectorAll('input[data-date]').forEach(el=>{
    el.classList.toggle('has-val',!!el.value);
    el.addEventListener('blur',function(){
      this.value=fmtDate(this.value);
      this.classList.toggle('has-val',!!this.value);
    });
  });
}
// ISO week number
function isoWeek(dt){
  const d=new Date(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate()));
  d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));
  const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d-y)/86400000)+1)/7);
}
// currency rates (approx)
const FX={USD:1,EUR:0.92,MYR:4.72,SGD:1.35};
function toUSD(amt,unit){return amt/(FX[unit]||1);}

// ════════════════════════════════════════════════════════
//  CONSTANTS
// ════════════════════════════════════════════════════════
const APQP_DEF=[
  {name:"Phase 1 — Plan & Define",col:"#0791A8",items:["Customer Inputs & Requirements","APQP Team","Numbered Drawing","Technical Review / Clarification","Preliminary Process Flow Chart","Preliminary Listing of Special Characteristics","Team Feasibility Commitment","APQP Milestone Chart","Management Support (MOM)"]},
  {name:"Phase 2 — Product Design & Development",col:"#3A6AB0",na:true,items:["N/A — Not Applicable"]},
  {name:"Phase 3 — Process Design & Development",col:"#B87E00",items:["New Equipment, Tooling & Facilities Requirements","Gauges & Testing Equipment Requirements","Process Flow Chart","Floor Plan Layout","Input to In-house Process Drawing","In-house Process Drawing Preparation","Tool Layout & Cutting Sequence","Packaging Specification","PFMEA","Pre-Launch Control Plan","Work Instruction","Measurement System Analysis Plan","Management Support (MOM)","Sample Build Activity"]},
  {name:"Phase 4 — Process Validation",col:"#C05A0A",items:["Production Trial Run","BOM","Measurement System Evaluation","Preliminary Process Capability Study","Production Part Approval Process","Process Improvement Activity Report","Production Control Plan","Quality Planning Sign Off","R&R (when required)","Management Support (MOM)"]},
  {name:"Phase 5 — Feedback, Assessment & Corrective Action",col:"#179B50",items:["Reduced Variation","Customer Satisfaction","MR or SOP","Management Support (MOM)"]},
];
const PPAP_ITEMS=["Design Records","DFMEA","Process Flow Diagram","PFMEA","Control Plan","MSA Study","Dimensional Results","Material / Performance Tests","Initial Process Study","Qualified Lab Documentation","Appearance Approval Report","Sample Parts","Master Sample","Checking Aids","Part Submission Warrant (PSW)"];
const PART_TYPES=["Prototype (Test)","Prototype (Sample)","Pre Launch (Pre Launch)","Production Run (Production)","Safe Launch (Safe Launch)"];
const PART_STATUS_OPTS=["Active","Not-Active","Mass Run"];
const SHOW_TYPES=["Prototype (Sample)","Pre Launch (Pre Launch)","Safe Launch (Safe Launch)","Production Run (Production)"];

function blankApqp(){return APQP_DEF.map(ph=>ph.items.map(()=>({done:false,planDate:'',complDate:''})));}
function blankPpap(){return {checks:PPAP_ITEMS.map(()=>false),pswStatus:'',pswDate:''};}

// ════════════════════════════════════════════════════════
//  DATABASE
// ════════════════════════════════════════════════════════
let DB={
  reg:{
    processes:[],
    customers:[],
    materials:[],
  },
  parts:[],
  issues:[],
  samples:[],
  rfqs:[],
  selPart:0,calY:new Date().getFullYear(),calM:new Date().getMonth(),
  _uidY:2025,_uidS:4,_issS:6,_sbS:4,_regId:100,_rfqS:1,
};
DB.parts.forEach(p=>{if(!p.apqp)p.apqp=blankApqp();if(!p.ppap)p.ppap=blankPpap();});

// ════════════════════════════════════════════════════════
//  HELPERS
// ════════════════════════════════════════════════════════
function genUID(){
  const y = new Date().getFullYear();
  // Always derive next sequence from actual parts in DB to avoid duplicates
  let maxSeq = 0;
  DB.parts.forEach(p => {
    if(!p.uid) return;
    const m = p.uid.match(/NPD-\d{4}-(\d+)$/);
    if(m) maxSeq = Math.max(maxSeq, parseInt(m[1]));
  });
  DB._uidS = maxSeq + 1;
  DB._uidY = y;
  return `NPD-${y}-${String(DB._uidS++).padStart(3,'0')}`;
}
function genIssId(){
  let max=0;
  DB.issues.forEach(i=>{const m=i.id&&i.id.match(/ISS-(\d+)$/);if(m)max=Math.max(max,parseInt(m[1]));});
  return `ISS-${String(max+1).padStart(3,'0')}`;
}
function genSbId(){
  let max=0;
  DB.samples.forEach(s=>{const m=s.id&&s.id.match(/SB-(\d+)$/);if(m)max=Math.max(max,parseInt(m[1]));});
  return `SB-${String(max+1).padStart(3,'0')}`;
}
function genRegId(){return DB._regId++;}
function genRfqId(){
  let max=0;
  DB.rfqs.forEach(r=>{const m=r.id&&r.id.match(/RFQ-(\d+)$/);if(m)max=Math.max(max,parseInt(m[1]));});
  return `RFQ-${String(max+1).padStart(3,'0')}`;
}
function rfqProgressChip(s){return chip(s||'Open',{'Open':'cb','In-Progress':'ca','Submit':'cg'}[s||'Open']||'cd');}
function rfqStatusChip(s){return chip(s||'Active',{'Active':'cg','Not Active':'cr'}[s||'Active']||'cd');}
function getCust(id){return DB.reg.customers.find(c=>c.id===id)||{name:"—"};}
function getProc(id){return DB.reg.processes.find(p=>p.id===id)||{name:"—",machines:[]};}
function getMat(id){return DB.reg.materials.find(m=>m.id===id)||{type:"—",size:"",length:""};}
function matShort(m){if(!m||m.type==="—")return "—";let s=m.type;if(m.size)s+=` ⌀${m.size}mm`;return s;}
function matFull(m){if(!m||m.type==="—")return "—";let s=m.type;if(m.size)s+=` ⌀${m.size}mm`;if(m.length)s+=` × ${m.length}mm`;return s;}
function eH(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}

function chip(t,cls){return `<span class="chip ${cls}">${eH(String(t))}</span>`;}
function stChip(s){const m={"on-track":"cg","at-risk":"ca","delayed":"cr","complete":"cb","not-started":"cd"};return chip({"on-track":"On Track","at-risk":"At Risk","delayed":"Delayed","complete":"Complete","not-started":"Not Started"}[s]||s,m[s]||'cd');}
function ptChip(t){if(t==="Prototype (Test)")return chip("Test","cb");if(t==="Prototype (Sample)")return chip("Sample","cp");if(t==="Pre Launch (Pre Launch)")return chip("Pre Launch","ca");if(t==="Production Run (Production)")return chip("Production","cg");if(t==="Safe Launch (Safe Launch)")return chip("Safe Launch","co");return chip(t,"cd");}
function psChip(s){return chip(s,{"Active":"cg","Not-Active":"cr","Mass Run":"cb"}[s]||'cd');}
function pswChip(s){if(!s)return '<span style="color:var(--dim);font-size:9px">—</span>';return chip(s,{"Accept":"cg","Reject":"cr","Conditional Accept":"ca","In Progress":"cb"}[s]||'cd');}
function smChip(s){return chip({"complete":"Complete","in-progress":"In Progress","pending":"Pending","delayed":"Delayed"}[s]||s,{"complete":"cg","in-progress":"ca","pending":"cd","delayed":"cr"}[s]||'cd');}
function svChip(s){return chip(s.charAt(0).toUpperCase()+s.slice(1),{"high":"cr","medium":"ca","low":"cg"}[s]||'cd');}

function ppapStatusOf(p){if(!p.ppap)return "not-started";const all=p.ppap.checks.every(Boolean);if(all)return "complete";return p.ppap.checks.some(Boolean)?"in-progress":"not-started";}
function ppapChipOf(p){const s=ppapStatusOf(p);return chip({"complete":"Complete","in-progress":"In Progress","not-started":"Not Started"}[s],{"complete":"cg","in-progress":"ca","not-started":"cd"}[s]);}

// APQP item status based on plan/complete dates
function apqpItemStatus(item){
  if(!item.planDate)return "not-started";
  if(item.planDate&&!item.complDate)return "in-progress";
  return "complete";
}
function apqpItemStatusChip(item){
  if(item.done||item.complDate){return chip("Complete","cg");}
  if(item.planDate){return chip("In Progress","ca");}
  return chip("Not Started","cd");
}

// Phase progress = % of items with complDate or done
function phaseProgress(apqp,phIdx){
  const ph=APQP_DEF[phIdx];if(!ph||!apqp)return 0;
  const items=apqp[phIdx];if(!items||!items.length)return 0;
  return Math.round(items.filter(x=>x.done||x.complDate).length/items.length*100);
}

// Phase description short
function phaseShort(i){return APQP_DEF[i]?.name?.split('—')[1]?.trim()||APQP_DEF[i]?.name||'';}

// Phase dots HTML
function phaseDots(p){
  return `<div class="pdots">`+APQP_DEF.map((ph,i)=>{
    const pct=phaseProgress(p.apqp,i);
    return `<div class="pdot" style="background:${ph.col};opacity:${pct>0?1:.2}" title="Ph${i+1}: ${pct}%"></div>`;
  }).join('')+'</div>';
}

// Current phase description
function currentPhaseDesc(p){
  let cur=0;
  for(let i=0;i<APQP_DEF.length;i++){const pct=phaseProgress(p.apqp,i);if(pct>0)cur=i;if(pct<100&&!APQP_DEF[i].na){cur=i;break;}}
  return `Ph${cur+1}: ${phaseShort(cur)}`;
}

// Sample build helpers
function procStatus(proc){
  const today=new Date();
  if(!proc.startActual)return "pending";
  if(!proc.endActual){const e=parseDt(proc.endPlan);if(e&&today>e)return "delayed";return "in-progress";}
  return "complete";
}
function currentProc(sb){
  for(let i=0;i<sb.procs.length;i++){const st=procStatus(sb.procs[i]);if(st!=='complete')return {proc:sb.procs[i],idx:i,status:st};}
  return {proc:sb.procs[sb.procs.length-1],idx:sb.procs.length-1,status:"complete"};
}
function allProcsComplete(sb){return sb.procs.every(p=>procStatus(p)==='complete');}

// Sales data: group by month based on shippedDate
function salesByMonth(){
  const map={};// key = "YYYY-M"
  DB.samples.forEach(sb=>{
    if(!sb.shippedDate)return;
    const d=parseDt(sb.shippedDate);if(!d)return;
    const k=`${d.getFullYear()}-${d.getMonth()}`;
    if(!map[k])map[k]={month:d.getMonth(),year:d.getFullYear(),qty:0,sales:0};
    map[k].qty+=sb.shipQty||0;
    map[k].sales+=sb.sellingPriceUSD||0;
  });
  return Object.values(map).sort((a,b)=>a.year*12+a.month-(b.year*12+b.month));
}

// ETD map
function etdMap(year,month){
  const map={};
  DB.samples.forEach(sb=>{
    const etds=(sb.etds&&sb.etds.length)?sb.etds:(sb.etdDate?[{date:sb.etdDate,qty:sb.shipQty||0}]:[]);
    etds.forEach(etd=>{
      const d=parseDt(etd.date);
      if(d&&d.getFullYear()===year&&d.getMonth()===month){
        const day=d.getDate();if(!map[day])map[day]=[];
        map[day].push(`${sb.pn} (${etd.qty}pcs)`);
      }
    });
  });
  return map;
}

// Customer counts (optionally filtered by part-type group: ''=all, 'test'=Prototype Test, 'sample'=Sample/PreLaunch/SafeLaunch/Production)
function custCounts(typeF){
  const SAMPLE_TYPES=["Prototype (Sample)","Pre Launch (Pre Launch)","Safe Launch (Safe Launch)","Production Run (Production)"];
  const TEST_TYPES=["Prototype (Test)"];
  const map={};
  DB.parts.forEach(p=>{
    if(typeF==='test' && !TEST_TYPES.includes(p.partType))return;
    if(typeF==='sample' && !SAMPLE_TYPES.includes(p.partType))return;
    const c=getCust(p.customerId).name;map[c]=(map[c]||0)+1;
  });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}

// PSW by year
function pswByYear(){
  const map={};
  DB.parts.forEach(p=>{if(p.pswDate){const d=parseDt(p.pswDate);if(d){const y=d.getFullYear();map[y]=(map[y]||0)+1;}}});
  return map;
}

const TABS=['dashboard','report','parts','sample','gantt','apqp','ppap','issues','list','registry'];
let curTab='dashboard';
function sw(tab){
  curTab=tab;
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',TABS[i]===tab));
  document.querySelectorAll('.vw').forEach(v=>v.classList.remove('active'));
  document.getElementById('vw-'+tab).classList.add('active');
  render(tab);
}
function render(t){({dashboard:rdDash,parts:rdParts,sample:rdSample,gantt:rdGantt,apqp:rdApqp,issues:rdIssues,ppap:rdPpap,registry:rdReg,list:rdList,report:rdReport}[t]||rdDash)();}

function sv(id,html){document.getElementById(id).innerHTML=`<div class="tab-scroll">${html}</div>`;}

// ── Theme toggle (persisted) ──
function applyTheme(mode){
  document.body.classList.toggle('dark', mode==='dark');
  const btn=document.getElementById('theme-tog');
  if(btn) btn.textContent = mode==='dark'?'☀️':'🌙';
}
function toggleTheme(){
  const next = document.body.classList.contains('dark')?'light':'dark';
  try{localStorage.setItem('npd-theme',next);}catch(e){}
  applyTheme(next);
  rr();
}
(function(){try{const t=localStorage.getItem('npd-theme')||'light';applyTheme(t);}catch(e){}})();

function updatePswChart(){
  const f=document.getElementById('psw-y1')?.value||'';
  const t=document.getElementById('psw-y2')?.value||'';
  _dashPswYearFrom=f;_dashPswYearTo=t;
  const ym=pswByYear();
  let ys=Object.keys(ym).sort();
  if(f)ys=ys.filter(y=>parseInt(y)>=parseInt(f));
  if(t)ys=ys.filter(y=>parseInt(y)<=parseInt(t));
  const pc=document.getElementById('pswC');if(!pc)return;
  pc.width=pc.parentElement.clientWidth-8;pc.height=pc.parentElement.clientHeight-8;
  if(ys.length){drawBar(pc,ys,ys.map(y=>ym[y]),'#1E6FD9',true);}
  else{const ctx=pc.getContext('2d');ctx.clearRect(0,0,pc.width,pc.height);ctx.fillStyle='#B0BCCF';ctx.font='10px Segoe UI';ctx.textAlign='center';ctx.fillText('No PSW data',pc.width/2,pc.height/2);}
}

function updateSalesChart(){
  const yr=document.getElementById('sales-yr')?.value||'';
  _dashSalesYear=yr;
  const sc=document.getElementById('salC');if(!sc)return;
  sc.width=sc.parentElement.clientWidth-8;sc.height=sc.parentElement.clientHeight-8;
  // Build 12-month grid for selected year
  const y=parseInt(yr)||new Date().getFullYear();
  const qty=Array(12).fill(0),sal=Array(12).fill(0);
  DB.samples.forEach(sb=>{
    if(!sb.shippedDate)return;const d=parseDt(sb.shippedDate);
    if(!d||d.getFullYear()!==y)return;
    qty[d.getMonth()]+=sb.shipQty||0;sal[d.getMonth()]+=sb.sellingPriceUSD||0;
  });
  const hasData=qty.some(v=>v>0)||sal.some(v=>v>0);
  if(hasData){drawDualBar(sc,MN,qty,sal);}
  else{const ctx=sc.getContext('2d');ctx.clearRect(0,0,sc.width,sc.height);ctx.fillStyle='#B0BCCF';ctx.font='10px Segoe UI';ctx.textAlign='center';ctx.fillText(`No sales data for ${y}`,sc.width/2,sc.height/2);}
}

function drawBar(cv,labels,data,col,showVals=false){
  const ctx=cv.getContext('2d');const W=cv.width,H=cv.height;ctx.clearRect(0,0,W,H);
  const pl=28,pb=20,pt=12,pr=6;const cw=(W-pl-pr)/Math.max(data.length,1);const ch=H-pb-pt;const mx=Math.max(...data,1);
  ctx.font='8px Segoe UI';ctx.fillStyle='#7A8BAD';
  [0,Math.round(mx/2),mx].forEach(v=>{const ty=pt+ch-ch*v/mx;ctx.textAlign='right';ctx.fillText(v,pl-2,ty+3);ctx.strokeStyle='#E8EEF8';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pl,ty);ctx.lineTo(W-pr,ty);ctx.stroke();});
  data.forEach((v,i)=>{const bh=ch*v/mx;const bx=pl+i*cw+2;const by=pt+ch-bh;
    ctx.fillStyle=col;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(bx,by,cw-4,bh,2);else ctx.rect(bx,by,cw-4,bh);ctx.fill();
    ctx.textAlign='center';ctx.fillStyle='#7A8BAD';if(i<labels.length)ctx.fillText(labels[i],bx+(cw-4)/2,H-4);
    if(showVals&&v>0){ctx.fillStyle=col;ctx.fillText(v,bx+(cw-4)/2,by-2);}
  });
}
function buildCal(year,month,emap){
  const n=new Date();const first=(new Date(year,month,1).getDay()+6)%7;const days=new Date(year,month+1,0).getDate();
  let h=['Mo','Tu','We','Th','Fr','Sa','Su'].map((d,i)=>`<div class="cal-dh" style="color:${i>=5?'var(--amber)':'var(--muted)'}">${d}</div>`).join('');
  for(let i=0;i<first;i++)h+=`<div class="cal-day em"></div>`;
  for(let d=1;d<=days;d++){
    const dow=(first+d-1)%7;const isT=(d===n.getDate()&&month===n.getMonth()&&year===n.getFullYear());
    const hasEtd=emap[d];
    const tip=hasEtd?`<div class="cal-tt">ETD: ${hasEtd.join(', ')}</div>`:'';
    h+=`<div class="cal-day ${isT?'td':''} ${dow>=5&&!isT?'we':''} ${hasEtd?'has-etd':''}">${d}${tip}</div>`;
  }
  return h;
}

// Dual bar + line chart for sales
function drawDualBar(cv,labels,qty,sal){
  const ctx=cv.getContext('2d');const W=cv.width,H=cv.height;ctx.clearRect(0,0,W,H);
  const pl=36,pb=28,pt=12,pr=40;
  const cw=(W-pl-pr)/Math.max(labels.length,1);const ch=H-pb-pt;
  const mxQ=Math.max(...qty,1),mxS=Math.max(...sal,1);
  // Y1 axis (Qty)
  ctx.font='8px Segoe UI';ctx.fillStyle='#3A6AB0';ctx.textAlign='right';
  [0,Math.round(mxQ/2),mxQ].forEach(v=>{const ty=pt+ch-ch*v/mxQ;ctx.fillText(v,pl-2,ty+3);ctx.strokeStyle='#E8EEF8';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pl,ty);ctx.lineTo(W-pr,ty);ctx.stroke();});
  // Y2 axis (Sales)
  ctx.fillStyle='#C42A2A';ctx.textAlign='left';
  [0,Math.round(mxS/2),mxS].forEach(v=>{const ty=pt+ch-ch*v/mxS;ctx.fillText('$'+v,W-pr+2,ty+3);});
  // Bars (Qty)
  qty.forEach((v,i)=>{
    const bh=ch*v/mxQ;const bx=pl+i*cw+2;const by=pt+ch-bh;
    ctx.fillStyle='rgba(58,106,176,0.7)';ctx.beginPath();if(ctx.roundRect)ctx.roundRect(bx,by,cw-4,bh,2);else ctx.rect(bx,by,cw-4,bh);ctx.fill();
    // Value label
    if(v>0){ctx.fillStyle='#3A6AB0';ctx.textAlign='center';ctx.fillText(v,bx+(cw-4)/2,by-2);}
    // X label
    ctx.fillStyle='#7A8BAD';ctx.textAlign='center';ctx.fillText(labels[i]||'',bx+(cw-4)/2,H-8);
  });
  // Line (Sales)
  if(sal.length>0){
    ctx.strokeStyle='#C42A2A';ctx.lineWidth=2;ctx.beginPath();
    sal.forEach((v,i)=>{const px=pl+i*cw+cw/2;const py=pt+ch-ch*v/mxS;i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);});
    ctx.stroke();
    sal.forEach((v,i)=>{
      const px=pl+i*cw+cw/2;const py=pt+ch-ch*v/mxS;
      ctx.fillStyle='#C42A2A';ctx.beginPath();ctx.arc(px,py,3,0,Math.PI*2);ctx.fill();
      if(v>0){ctx.fillStyle='#C42A2A';ctx.textAlign='center';ctx.fillText('$'+v.toFixed(0),px,py-5);}
    });
  }
  // Axis labels
  ctx.fillStyle='#3A6AB0';ctx.font='8px Segoe UI';ctx.textAlign='center';ctx.save();ctx.translate(10,pt+ch/2);ctx.rotate(-Math.PI/2);ctx.fillText('Ship Qty',0,0);ctx.restore();
  ctx.fillStyle='#C42A2A';ctx.save();ctx.translate(W-8,pt+ch/2);ctx.rotate(Math.PI/2);ctx.fillText('Selling Price (USD)',0,0);ctx.restore();
}

// Gantt state
let _ganttSelI=0, _ganttWeekOffset=0, _ganttShowAll=false, _ganttSearch='';

function _ganttVisibleSamples(){
  const srch=(_ganttSearch||'').trim().toLowerCase();
  return DB.samples.map((s,i)=>({s,i})).filter(({s})=>{
    if(!_ganttShowAll && !!s.shippedDate) return false;
    if(srch){
      const hay=[s.id,s.pn,s.customer].join(' ').toLowerCase();
      if(!hay.includes(srch)) return false;

// Update only the dropdown options and the gantt chart — keep search input focused
function _ganttRefreshDropAndChart(){
  const visibleSamples=_ganttVisibleSamples();
  const sel=document.getElementById('gantt-sel');
  const infoEl=document.getElementById('gantt-info-area');
  const chartEl=document.getElementById('gantt-chart-area');
  if(!sel||!infoEl||!chartEl){rdGantt();return;}

  if(!visibleSamples.length){
    sel.innerHTML='<option value="">— No results —</option>';
    infoEl.innerHTML='';
    chartEl.innerHTML='<div style="padding:20px;color:var(--muted);font-size:11px">No sample builds match the current filter. <button onclick="_ganttShowAll=true;_ganttSearch=\'\';document.getElementById(\'gantt-search-inp\').value=\'\';_ganttRefreshDropAndChart()" class="btn btn-s" style="margin-left:8px;font-size:10px">Show All</button></div>';
    return;
  }

  if(!visibleSamples.find(({i})=>i===_ganttSelI)) _ganttSelI=visibleSamples[0].i;
  sel.innerHTML=visibleSamples.map(({s,i})=>`<option value="${i}" ${i===_ganttSelI?'selected':''}>${s.id} — ${s.pn} — ${s.customer}</option>`).join('');
  sel.value=_ganttSelI;

  _ganttRenderChart(infoEl,chartEl);
}

function _ganttRenderChart(infoEl,chartEl){
  const sb=DB.samples[Math.min(_ganttSelI,DB.samples.length-1)];
  if(!sb){return;}
  const part=DB.parts.find(p=>p.pn===sb.pn)||{name:'',rev:'',uid:''};
  const cust=getCust(DB.parts.find(p=>p.pn===sb.pn)?.customerId||0);
  const sd=parseDt(sb.startDate)||new Date();
  const dow=(sd.getDay()+6)%7;
  const baseStart=new Date(sd);baseStart.setDate(baseStart.getDate()-dow);
  const gridStart=new Date(baseStart);gridStart.setDate(gridStart.getDate()+_ganttWeekOffset*7);
  const totalDays=35;
  const days=[];for(let i=0;i<totalDays;i++){const d=new Date(gridStart);d.setDate(d.getDate()+i);days.push(d);}
  const allEtds = (sb.etds&&sb.etds.length) ? sb.etds : (sb.etdDate ? [{date:sb.etdDate,qty:sb.shipQty||0}] : []);
  const etdDates = allEtds.map(e=>({d:parseDt(e.date),qty:e.qty})).filter(e=>e.d);
  const today=new Date();

  let weekRow='<tr>'+
    '<th class="g-lbl" rowspan="3" style="min-width:110px;position:sticky;left:0;top:0;z-index:5;background:var(--card2)">Process</th>'+
    '<th rowspan="3" style="min-width:88px;position:sticky;left:110px;top:0;z-index:5;background:var(--card2);font-size:9px;font-weight:700;color:var(--text2);padding:3px 4px;text-align:center;border-right:1px solid var(--border)">START</th>'+
    '<th rowspan="3" style="min-width:88px;position:sticky;left:198px;top:0;z-index:5;background:var(--card2);font-size:9px;font-weight:700;color:var(--text2);padding:3px 4px;text-align:center;border-right:1.5px solid var(--border2)">END</th>'+
    '<th class="g-sub" rowspan="3" style="min-width:44px;position:sticky;left:286px;top:0;z-index:5;background:var(--card2)">Plan/<br>Actual</th>';
  for(let i=0;i<5;i++){const wd=days[i*7];weekRow+=`<th colspan="7" style="background:#E8EEFA;position:sticky;top:0;z-index:4">W${isoWeek(wd)} — ${MN[wd.getMonth()]} ${wd.getDate()}, ${wd.getFullYear()}</th>`;}
  weekRow+='</tr>';

  let dayNameRow='<tr>',dayNumRow='<tr>';
  const dnames=['Mo','Tu','We','Th','Fr','Sa','Su'];
  days.forEach(d=>{
    const isT=d.toDateString()===today.toDateString();
    const isWe=d.getDay()===0||d.getDay()===6;
    const cls=`${isT?'today-col':''}${isWe?' weekend':''}`;
    dayNameRow+=`<th class="g-cell ${cls}" style="min-width:30px;width:30px;position:sticky;top:18px;z-index:4">${dnames[(d.getDay()+6)%7]}</th>`;
    dayNumRow+=`<th class="g-cell ${cls}" style="min-width:30px;width:30px;position:sticky;top:32px;z-index:4">${d.getDate()}</th>`;
  });
  dayNameRow+='</tr>';dayNumRow+='</tr>';

  function buildRow(proc,type,startStr,endStr){
    const s=parseDt(startStr),e=parseDt(endStr);
    const st=procStatus(proc);const isDelay=(type==='actual'&&st==='delayed');
    return days.map(d=>{
      const isT=d.toDateString()===today.toDateString();
      const isWe=d.getDay()===0||d.getDay()===6;
      let inner='';
      if(s&&e){
        const dMs=d.getTime(),sMs=s.getTime(),eMs=e.getTime();
        if(dMs>=sMs&&dMs<=eMs){
          const isStart=dMs===sMs,isEnd=dMs===eMs;
          const cls=type==='plan'?'g-bar-plan':('g-bar-actual'+(isDelay?' g-bar-delay':''));
          const lr=`${isStart?'3px':'0'} ${isEnd?'3px':'0'} ${isEnd?'3px':'0'} ${isStart?'3px':'0'}`;
          const lpad=isStart?'2px':'-1px';
          const rpad=isEnd?'2px':'-1px';
          const bl=isStart?'':'border-left:none;';
          const br=isEnd?'':'border-right:none;';
          inner+=`<div class="${cls}" style="left:${lpad};right:${rpad};border-radius:${lr};${bl}${br}"></div>`;
        }
      }
      const matchedEtd = etdDates.find(e=>d.toDateString()===e.d.toDateString());
      if(matchedEtd) inner+=`<div class="g-marker-etd" title="ETD: ${matchedEtd.qty} pcs"></div>`;
      if(d.toDateString()===sd.toDateString())inner+=`<div class="g-marker-start"></div>`;
      const cls2=`g-cell${isT?' today-col':''}${isWe?' weekend':''}`;
      return `<td class="${cls2}">${inner}</td>`;
    }).join('');
  }

  let procRows='';
  sb.procs.forEach((proc,pi)=>{
    const st=procStatus(proc);const stc={"pending":"var(--dim)","in-progress":"var(--amber)","complete":"var(--green)","delayed":"var(--red)"}[st];
    const sbIdx=_ganttSelI; const pii=pi;
    function _dinp(val,field,accentCol,bg){
      return `<input data-date type="text" value="${eH(val)}" placeholder="dd-mmm-yy"
        style="width:70px;font-size:9px;padding:2px 4px;border:1px solid var(--border);border-radius:3px;background:${val?bg:'var(--bg)'};color:${accentCol};text-align:center"
        onblur="ganttSaveDate(${sbIdx},${pii},'${field}',this.value);this.style.borderColor='var(--border)'"
        onfocus="this.style.borderColor='${accentCol}';this.style.background='#fff'">`;
    }
    procRows+=`<tr>
      <td class="g-lbl" rowspan="2" style="vertical-align:middle;position:sticky;left:0;z-index:1;background:var(--card)">${pi+1}. ${proc.name}<br><span style="font-size:8.5px;color:${stc};font-weight:600">${st.charAt(0).toUpperCase()+st.slice(1)}</span></td>
      <td style="position:sticky;left:110px;z-index:1;background:var(--card);padding:2px 4px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);min-width:88px;text-align:center">
        ${_dinp(proc.startPlan,'startPlan','var(--accent)','#EBF5FF')}
      </td>
      <td style="position:sticky;left:198px;z-index:1;background:var(--card);padding:2px 4px;border-right:1.5px solid var(--border2);border-bottom:1px solid var(--border);min-width:88px;text-align:center">
        ${_dinp(proc.endPlan,'endPlan','var(--accent)','#EBF5FF')}
      </td>
      <td class="g-sub" style="color:var(--accent);position:sticky;left:286px;z-index:1;background:var(--card)">Plan</td>${buildRow(proc,'plan',proc.startPlan,proc.endPlan)}</tr>`;
    procRows+=`<tr>
      <td style="position:sticky;left:110px;z-index:1;background:var(--card);padding:2px 4px;border-right:1px solid var(--border);min-width:88px;text-align:center">
        ${_dinp(proc.startActual,'startActual','var(--green)','#EBFFF5')}
      </td>
      <td style="position:sticky;left:198px;z-index:1;background:var(--card);padding:2px 4px;border-right:1.5px solid var(--border2);min-width:88px;text-align:center">
        ${_dinp(proc.endActual,'endActual','var(--green)','#EBFFF5')}
      </td>
      <td class="g-sub" style="color:var(--green);position:sticky;left:286px;z-index:1;background:var(--card)">Actual</td>${buildRow(proc,'actual',proc.startActual,proc.endActual)}</tr>`;
  });

  // Material type comes from the SAMPLE BUILD (not the part) — since sample builds may borrow different material sizes
  const mat = sb.materialId ? getMat(sb.materialId) : null;
  const turningOp = (part.ops||[]).find(o=>{
    const procName = getProc(o.processId).name||'';
    return procName.toLowerCase().includes('turning');
  });
  const turningMc = turningOp ? (turningOp.machine||'—') : '—';
  const turningCt = turningOp ? (turningOp.ct?`${turningOp.ct}s`:'—') : '—';
  const matUsage = (sb.materialBarPcs||sb.materialWeightKg)
    ? `${sb.materialBarPcs||0} pcs / ${sb.materialWeightKg||0} kg`
    : '—';

  infoEl.innerHTML=`
    <div class="gantt-info-item"><label>Part / Name</label><span>${sb.pn} — ${part.name}</span></div>
    <div class="gantt-info-item"><label>Rev</label><span>${part.rev||'—'}</span></div>
    <div class="gantt-info-item"><label>Customer</label><span>${cust.name}</span></div>
    <div class="gantt-info-item"><label>Start Date</label><span style="color:var(--accent)">${sb.startDate||'—'}</span></div>
    <div class="gantt-info-item" style="min-width:200px"><label>ETD Date / Qty</label><span style="color:var(--red)">${
      allEtds.length
        ? allEtds.map(e=>`${e.date||'—'} (${e.qty||0}pcs)`).join(', ')
        : '—'
    }</span></div>
    <div class="gantt-info-item"><label>Plan / Total Ship Qty</label><span>${sb.planQty} / ${sb.shipQty}</span></div>
    <div class="gantt-info-item"><label>Material</label><span>${mat?matFull(mat):'—'}</span></div>
    <div class="gantt-info-item"><label>Material Usage: No of Bar (pcs) / Weight (kg)</label><span>${matUsage}</span></div>
    <div class="gantt-info-item"><label>Turning M/C</label><span>${turningMc}</span></div>
    <div class="gantt-info-item"><label>C/T</label><span>${turningCt}</span></div>`;

  chartEl.innerHTML=`<table class="g-tbl" style="border-collapse:collapse"><thead>${weekRow}${dayNameRow}${dayNumRow}</thead><tbody>${procRows}</tbody></table>`;
  const ol=document.getElementById('gantt-offset-lbl');if(ol)ol.textContent=`Week offset: ${_ganttWeekOffset>0?'+':''}${_ganttWeekOffset}`;
}

// ════════════════════════════════════════════════════════
//  APQP — Checklist with plan/complete dates & status
// ════════════════════════════════════════════════════════
function rdApqp(){
  const validParts=DB.parts.map((p,i)=>({p,i})).filter(({p})=>p.partType!=='Prototype (Test)');
  if(!validParts.length){sv('vw-apqp','<p style="padding:20px;color:var(--muted)">No parts available for APQP (Prototype Test parts are excluded).</p>');return;}
  // Clamp selPart to a valid index
  if(!validParts.find(({i})=>i===DB.selPart)) DB.selPart=validParts[0].i;
  const pOpts=validParts.map(({p,i})=>`<option value="${i}" ${i===DB.selPart?'selected':''}>${p.pn} — ${p.name}</option>`).join('');
  const p=DB.parts[DB.selPart];const c=getCust(p.customerId);

  const phBlocks=APQP_DEF.map((ph,phIdx)=>{
    const pct=phaseProgress(p.apqp,phIdx);
    const items=p.apqp[phIdx];
    const _pn   = p.pn.replace(/'/g,"\'");
    const _phNm = ph.name.replace(/'/g,"\'");
    const ciRows=ph.items.map((label,itIdx)=>{
      const item=items[itIdx];const isNA=ph.na;
      const _lbl  = label.replace(/'/g,"\'");
      const st=isNA?apqpItemStatus(item):''; // N/A items still tickable
      const stCol2={"not-started":"var(--dim)","in-progress":"var(--amber)","complete":"var(--green)","":""};
      const stLbl2={"not-started":"Not Started","in-progress":"In Progress","complete":"Complete","":" "};
      const itemSt=apqpItemStatus(item);
      const stCol=stCol2[itemSt]||"var(--dim)";
      const stLbl=stLbl2[itemSt]||"—";
      // Get files for this APQP item
      const fileKey = `${p.uid}_ph${phIdx}_it${itIdx}`;
      const itemFiles = (_apqpFiles[fileKey]||[]);
      const fileChips = itemFiles.map((fn,fi)=>`
        <span class="ci-file-chip" onclick="_apqpViewBtn(this)" data-uid="${p.uid}" data-pn="${p.pn}" data-ph="${phIdx}" data-it="${itIdx}" data-fi="${fi}" title="Click to view: ${eH(fn)}">
          📄 ${eH(fn.replace(/^\d+_/,''))}
          <span class="del-f" onclick="event.stopPropagation();delApqpFile('${eH(p.uid)}',${phIdx},${itIdx},${fi})" title="Remove">✕</span>
        </span>`).join('');
      return `<div class="ci-row" style="grid-template-columns:18px 1fr 115px 115px 80px 100px;flex-wrap:wrap">
        <input type="checkbox" class="ci-cb" ${item.done?'checked':''} onchange="togApqp(${phIdx},${itIdx},this.checked)">
        <span class="ci-lbl ${isNA?'na':''}">${label}</span>
        <input type="text" class="ci-din ${item.planDate?'filled':''}" placeholder="Plan dd-mmm-yy" value="${eH(item.planDate)}" data-date onblur="setApqpPlan(${phIdx},${itIdx},this)">
        <input type="text" class="ci-din ${item.complDate?'filled':''}" placeholder="Complete dd-mmm-yy" value="${eH(item.complDate)}" data-date onblur="setApqpCompl(${phIdx},${itIdx},this)">
        <span class="ci-status" style="color:${stCol};font-weight:700">${stLbl}</span>
        <button class="ci-upload-btn" onclick="_apqpUploadBtn(this)" 
          data-uid="${p.uid}" data-pn="${p.pn}" data-ph="${phIdx}" data-it="${itIdx}" 
          data-phname="${ph.name}" data-item="${label}"
          title="Upload document">📎 Upload</button>
        ${fileChips?`<div class="ci-files" style="grid-column:1/-1">${fileChips}</div>`:''}
      </div>`;}).join('');
    return `<div class="phase-block">
      <div class="phase-hdr" onclick="togPhase(this)">
        <span class="phase-title" style="color:${ph.col}">${ph.name}</span>
        <div><div class="pb-wrap" style="height:7px"><div class="pb-fill" style="width:${pct}%;background:${ph.col}"></div></div></div>
        <span class="phase-pct-lbl" style="color:${ph.col}">${pct}%</span>
      </div>
      <div class="phase-body" style="display:block">
        <div style="display:grid;grid-template-columns:18px 1fr 115px 115px 80px 100px;padding:3px 10px 2px;background:var(--bg);border-bottom:1px solid var(--border)">
          <span></span><span style="font-size:8px;font-weight:700;color:var(--muted)">ITEM</span>
          <span style="font-size:8px;font-weight:700;color:var(--muted)">PLAN DATE</span>
          <span style="font-size:8px;font-weight:700;color:var(--muted)">COMPLETE DATE</span>
          <span style="font-size:8px;font-weight:700;color:var(--muted);text-align:center">STATUS</span>
          <span style="font-size:8px;font-weight:700;color:var(--muted)">FILES</span>
        </div>
        ${ciRows}
      </div>
    </div>`;}).join('');

  const pCmbOpts=validParts.map(({p,i})=>({value:String(i),label:`${p.pn} — ${p.name}`}));
  const pCmb=makeCmb('apqp-part',pCmbOpts,String(DB.selPart),null,'Search part…','min-width:280px');

  sv('vw-apqp',`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap">
      <label style="font-size:8.5px;font-weight:700;color:var(--muted)">PART:</label>
      ${pCmb}
      <button class="btn-tick-all" onclick="tickAllApqp()">☑ Tick All</button>
      <button class="btn-e" onclick="openEditPartModal(${DB.selPart})">✎ Edit Part</button>
      <div style="margin-left:auto;display:flex;gap:6px">
        <button onclick="openPartFolder(${DB.selPart})" style="padding:4px 13px;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;background:var(--card2);color:var(--cyan);border:1.5px solid var(--cyan);display:flex;align-items:center;gap:5px;transition:all .15s" onmouseover="this.style.background='var(--cyan)';this.style.color='#fff'" onmouseout="this.style.background='var(--card2)';this.style.color='var(--cyan)'">📂 Open Folder</button>
        <button onclick="createApqpFolders(${DB.selPart})" style="padding:4px 13px;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;background:var(--card2);color:var(--steel);border:1.5px solid var(--steel);display:flex;align-items:center;gap:5px;transition:all .15s" onmouseover="this.style.background='var(--steel)';this.style.color='#fff'" onmouseout="this.style.background='var(--card2)';this.style.color='var(--steel)'">📁 Create Folder Structure</button>
      </div>
    </div>
    <div class="card" style="padding:8px 12px;margin-bottom:8px;background:var(--card2)">
      <div style="font-weight:700;font-size:13px">${p.uid} — ${p.pn} — ${p.name}</div>
      <div style="font-size:9.5px;color:var(--muted);margin-top:2px">${c.name} | ${p.program} | Eng: ${p.engineer} | SOP: ${p.sop||'—'} | ${ptChip(p.partType)}</div>
    </div>
    ${phBlocks}`);
  cmbReg('apqp-part',(val)=>{DB.selPart=parseInt(val);rdApqp();});
}

function _apqpSaveScroll(){
  const sc=document.querySelector('#vw-apqp .tab-scroll');
  return sc?sc.scrollTop:0;
}
function _apqpRestoreScroll(top){
  const sc=document.querySelector('#vw-apqp .tab-scroll');
  if(sc)sc.scrollTop=top;
}
function togApqp(phIdx,itIdx,val){
  const top=_apqpSaveScroll();
  const p=DB.parts[DB.selPart];p.apqp[phIdx][itIdx].done=val;
  if(val&&!p.apqp[phIdx][itIdx].complDate)p.apqp[phIdx][itIdx].complDate=todayFmt();
  if(!val){p.apqp[phIdx][itIdx].complDate='';}
  const item=p.apqp[phIdx][itIdx];
  _apiFetch('/parts/'+p._dbId+'/apqp','PATCH',{phase_idx:phIdx,item_idx:itIdx,done:item.done,plan_date:item.planDate||'',compl_date:item.complDate||''});
  rdApqp();
  requestAnimationFrame(()=>_apqpRestoreScroll(top));
}
function setApqpPlan(phIdx,itIdx,el){
  const v=fmtDate(el.value);el.value=v;
  const p=DB.parts[DB.selPart];
  p.apqp[phIdx][itIdx].planDate=v;
  el.classList.toggle('filled',!!v);
  _apiFetch('/parts/'+p._dbId+'/apqp','PATCH',{phase_idx:phIdx,item_idx:itIdx,done:p.apqp[phIdx][itIdx].done,plan_date:v,compl_date:p.apqp[phIdx][itIdx].complDate||''});
}
function setApqpCompl(phIdx,itIdx,el){
  const top=_apqpSaveScroll();
  const v=fmtDate(el.value);el.value=v;
  const p=DB.parts[DB.selPart];
  const item=p.apqp[phIdx][itIdx];
  item.complDate=v;if(v)item.done=true;
  el.classList.toggle('filled',!!v);
  _apiFetch('/parts/'+p._dbId+'/apqp','PATCH',{phase_idx:phIdx,item_idx:itIdx,done:item.done,plan_date:item.planDate||'',compl_date:item.complDate||''});
  _apqpRestoreScroll(top);
}
function togPhase(hdr){const b=hdr.nextElementSibling;b.style.display=b.style.display==='none'?'block':'none';}

// ─── TICK ALL ────────────────────────────────────────────
function tickAllApqp(){
  const p=DB.parts[DB.selPart];
  const top=_apqpSaveScroll();
  APQP_DEF.forEach((_,phIdx)=>{
    p.apqp[phIdx].forEach((item,itIdx)=>{
      if(!item.done){item.done=true;if(!item.complDate)item.complDate=todayFmt();}
      _apiFetch('/parts/'+p._dbId+'/apqp','PATCH',{phase_idx:phIdx,item_idx:itIdx,done:item.done,plan_date:item.planDate||'',compl_date:item.complDate||''});
    });
  });
  rdApqp();requestAnimationFrame(()=>_apqpRestoreScroll(top));
}
function tickAllPpap(){
  const p=DB.parts[DB.selPart];

// ─── CREATE APQP FOLDER STRUCTURE ────────────────────────

async function openPartFolder(partIdx){
  const p = DB.parts[partIdx];
  if(!p){ alert('No part selected.'); return; }
  try{
    const resp = await fetch(window.location.origin + '/api/open-folder', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ folderPath: `Project/${p.pn}` })
    });
    const j = await resp.json();
    if(j.ok){
      _showFileToast(`📂 Opening folder for ${p.pn}...`);
    } else {
      alert('Could not open folder: ' + (j.error||'Unknown error'));
    }
  } catch(e){
    alert('Could not open folder: ' + e.message);
  }
}

async function createApqpFolders(partIdx){
  const p=DB.parts[partIdx];
  if(!p){alert('No part selected.');return;}

  function toast(msg,col='var(--accent)'){
    let t=document.getElementById('apqp-folder-toast');
    if(!t){t=document.createElement('div');t.id='apqp-folder-toast';t.style.cssText='position:fixed;bottom:20px;right:20px;z-index:9999;padding:10px 18px;border-radius:7px;font-size:11.5px;font-weight:600;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.22);transition:opacity .3s';document.body.appendChild(t);}
    t.style.background=col;t.style.opacity='1';t.textContent=msg;
    clearTimeout(t._to);
  }
  function toastDone(msg){
    toast(msg,'var(--green)');
    const t=document.getElementById('apqp-folder-toast');
    if(t)t._to=setTimeout(()=>{t.style.opacity='0';},4000);
  }
  function toastErr(msg){
    toast(msg,'var(--red)');
    const t=document.getElementById('apqp-folder-toast');
    if(t)t._to=setTimeout(()=>{t.style.opacity='0';},5000);
  }

  try{
    toast('⏳ Creating folder structure on server…');
    const result = await _apiFetch('/create-folders','POST',{
      partUid: p.uid,
      pn: p.pn,  // folder named by PN
      name: p.name,
      phases: APQP_DEF.map(ph=>({name:ph.name, items:ph.items}))
    });
    _folderExists[p.pn] = true; // update cache
    toastDone(`✅ Created ${result.count} folders for ${p.pn} under Project/${p.pn}/`);
  } catch(e){
    toastErr(`❌ Error: ${e.message}`);
    console.error('APQP folder creation error:',e);
  }
}

// ─── SEARCHABLE COMBOBOX ──────────────────────────────────
// Renders a combobox. opts = [{value, label}]. onChange(value) called on selection.
function makeCmb(id, opts, currentVal, onChangeFn, placeholder='Search…', extraStyle=''){
  const selLabel = opts.find(o=>o.value===currentVal)?.label || currentVal || '';
  return `<div class="cmb-wrap" style="${extraStyle}" id="cmb-${id}">
    <input class="cmb-inp" id="cmb-inp-${id}" value="${eH(selLabel)}" placeholder="${eH(placeholder)}"
      autocomplete="off"
      onfocus="cmbOpen('${id}')"
      oninput="cmbFilter('${id}')"
      onkeydown="cmbKey(event,'${id}')">
    <div class="cmb-drop" id="cmb-drop-${id}">
      ${opts.map((o,i)=>`<div class="cmb-opt" data-val="${eH(o.value)}" data-lbl="${eH(o.label)}" data-idx="${i}"
        onmousedown="cmbSelect('${id}','${eH(o.value)}','${eH(o.label)}')">${eH(o.label)}</div>`).join('')}
    </div>
    <input type="hidden" id="cmb-val-${id}" value="${eH(currentVal||'')}">
  </div>`;
}
// Store callbacks by id
const _cmbCbs={};
function cmbReg(id,fn){_cmbCbs[id]=fn;}
function cmbOpen(id){
  document.querySelectorAll('.cmb-drop.open').forEach(d=>{if(d.id!==`cmb-drop-${id}`)d.classList.remove('open');});
  const drop=document.getElementById(`cmb-drop-${id}`);
  if(drop){drop.classList.add('open');cmbFilter(id);}
}
function cmbFilter(id){
  const inp=document.getElementById(`cmb-inp-${id}`);
  const drop=document.getElementById(`cmb-drop-${id}`);
  if(!inp||!drop)return;
  const q=inp.value.toLowerCase();
  let any=false;
  drop.querySelectorAll('.cmb-opt:not(.no-res)').forEach(opt=>{
    const show=!q||opt.dataset.lbl.toLowerCase().includes(q);
    opt.style.display=show?'':'none';if(show)any=true;
  });
  let noRes=drop.querySelector('.cmb-no-res');
  if(!any){if(!noRes){noRes=document.createElement('div');noRes.className='cmb-opt no-res cmb-no-res';noRes.textContent='No results';drop.appendChild(noRes);}}
  else{if(noRes)noRes.remove();}
  drop.classList.add('open');
}
function cmbSelect(id,val,lbl){
  const inp=document.getElementById(`cmb-inp-${id}`);
  const hid=document.getElementById(`cmb-val-${id}`);
  const drop=document.getElementById(`cmb-drop-${id}`);
  if(inp)inp.value=lbl;if(hid)hid.value=val;
  if(drop)drop.classList.remove('open');
  if(_cmbCbs[id])_cmbCbs[id](val,lbl);
}
function cmbKey(e,id){
  const drop=document.getElementById(`cmb-drop-${id}`);if(!drop)return;
  const vis=[...drop.querySelectorAll('.cmb-opt:not(.no-res)')].filter(o=>o.style.display!=='none');
  const hi=drop.querySelector('.cmb-opt.hi');
  let idx=hi?vis.indexOf(hi):-1;
  if(e.key==='ArrowDown'){e.preventDefault();idx=Math.min(idx+1,vis.length-1);}
  else if(e.key==='ArrowUp'){e.preventDefault();idx=Math.max(idx-1,0);}
  else if(e.key==='Enter'){if(hi){e.preventDefault();cmbSelect(id,hi.dataset.val,hi.dataset.lbl);return;}}
  else if(e.key==='Escape'){drop.classList.remove('open');return;}
  else return;
  drop.querySelectorAll('.cmb-opt').forEach(o=>o.classList.remove('hi'));
  if(vis[idx]){vis[idx].classList.add('hi');vis[idx].scrollIntoView({block:'nearest'});}
}
// Close dropdowns when clicking outside
document.addEventListener('mousedown',e=>{
  if(!e.target.closest('.cmb-wrap')){
    document.querySelectorAll('.cmb-drop.open').forEach(d=>d.classList.remove('open'));
  }
});

  const mi=iss.filter(x=>x.status==='open'&&x.severity==='medium').length,ci=iss.filter(x=>x.status==='closed').length;
  const kH=[['Open',oi,'var(--red)'],['High',hi,'var(--red)'],['Medium',mi,'var(--amber)'],['Closed',ci,'var(--green)']]
    .map(([l,v,c])=>`<div class="iss-kpi" style="border-color:${c};background:${c}11"><div style="font-size:8px;font-weight:700;color:${c};text-transform:uppercase">${l}</div><div style="font-size:20px;font-weight:800;color:${c}">${v}</div></div>`).join('');
  const rows=iss.map((x,i)=>{const p=DB.parts.find(pt=>pt.uid===x.partUid)||{pn:'—'};const cl=x.status==='closed';
    return `<tr style="opacity:${cl?.65:1}"><td style="font-size:9px;color:var(--muted)">${x.id}</td><td style="color:var(--accent)">${p.pn}</td><td>${svChip(x.severity)}</td>

    <td style="font-size:10px;color:var(--text2)">${x.owner}</td><td style="font-size:9.5px;color:var(--muted)">${x.date}</td>
    <td><span style="font-weight:600;font-size:10px;color:${cl?'var(--green)':'var(--red)'}">${cl?'Closed':'Open'}</span></td>
    <td><div style="display:flex;gap:3px"><button class="btn-sm ${cl?'btn-ro':'btn-ci'}" onclick="togIss(${i})">${cl?'Reopen':'Close'}</button><button class="btn-e" onclick="openIssueModal(${i})">✎</button><button class="btn-d" onclick="delIss(${i})">✕</button></div></td></tr>`;}).join('');
  sv('vw-issues',`<div style="display:flex;gap:6px;margin-bottom:8px">${kH}</div>
    <div class="card"><div class="ct">Issue / Task Log</div><div style="overflow-x:auto"><table class="tbl">

    </table></div></div>`);

function togIss(i){const dbId=DB.issues[i]._dbId;_apiFetch('/issues/'+dbId+'/toggle','PATCH').then(()=>loadFromDB().then(()=>rdIssues()));DB.issues[i].status=DB.issues[i].status==='open'?'closed':'open';rdIssues();}

function rdPpap(){

  if(!validParts.find(({i})=>i===DB.selPart)) DB.selPart=validParts[0].i;
  const pOpts=validParts.map(({p,i})=>`<option value="${i}" ${i===DB.selPart?'selected':''}>${p.pn} — ${p.name}</option>`).join('');
  const p=DB.parts[DB.selPart];const pp=p.ppap;
  const ppSt=ppapStatusOf(p);const pct=Math.round(pp.checks.filter(Boolean).length/PPAP_ITEMS.length*100);
  const pctCol=ppSt==='complete'?'var(--green)':ppSt==='in-progress'?'var(--amber)':'var(--dim)';
  const stBadge=chip({"complete":"Complete","in-progress":"In Progress","not-started":"Not Started"}[ppSt],{"complete":"cg","in-progress":"ca","not-started":"cd"}[ppSt]);
  const checkRows=PPAP_ITEMS.map((el,j)=>`

  const allDone=pp.checks.every(Boolean);

    <div class="psw-section">
      <div style="font-size:9px;font-weight:700;color:var(--accent);text-transform:uppercase;padding:0 9px 4px">PSW Status</div>

      ${pp.pswStatus?`<div style="padding:5px 9px;display:flex;gap:7px;align-items:center;font-size:10.5px"><span style="color:var(--muted)">PSW:</span>${pswChip(pp.pswStatus)} ${p.pswDate?`<span style="color:var(--muted)">${p.pswDate}</span>`:''}</div>`:''}
    </div>`:'<div style="padding:8px;font-size:10px;color:var(--muted);font-style:italic">Tick all PPAP items to unlock PSW status.</div>';
  const cust=getCust(p.customerId);const mat=getMat(p.materialId);
  const summary=[['UID',p.uid],['Part No.',p.pn],['Part Name',p.name],['Customer',cust.name],['Program',p.program],['Engineer',p.engineer],['PPAP Level',`Level ${p.ppapLevel}`],['PPAP Status',{"not-started":"Not Started","in-progress":"In Progress","complete":"Complete"}[ppSt]],['Part Type',p.partType],['Target SOP',p.sop||'—'],['Drawing Rev',p.rev],['Material',matFull(mat)]]
    .map(([l,v])=>`<div style="display:flex;justify-content:space-between;padding:4px 9px;border-bottom:1px solid var(--border);font-size:10.5px"><span style="color:var(--muted);font-weight:600">${l}</span><span style="text-align:right;max-width:55%">${eH(v)}</span></div>`).join('');
  const pCmbOpts2=validParts.map(({p,i})=>({value:String(i),label:`${p.pn} — ${p.name}`}));
  const pCmb2=makeCmb('ppap-part',pCmbOpts2,String(DB.selPart),null,'Search part…','min-width:280px');

  sv('vw-ppap',`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap">

// Dynamically detect OPxx Process / Machine / C/T columns — supports any number (OP10, OP20...OP90, OP100...)
function _extractBulkOps(rawRow){
  const opNums = new Set();
  Object.keys(rawRow).forEach(key=>{
    const m = key.match(/^OP(\d+)\s+Process$/i);
    if(m) opNums.add(m[1]);
  });
  const sorted = [...opNums].sort((a,b)=>parseInt(a)-parseInt(b));
  return sorted.map(n=>({
    op: 'OP'+n,
    process: String(rawRow[`OP${n} Process`]||'').trim(),
    machine: String(rawRow[`OP${n} Machine`]||'').trim(),
    ct: String(rawRow[`OP${n} C/T (sec)`]||'').trim()
  })).filter(o=>o.process);
}

async function _handleBulkFile(ev){
  const file = ev.target.files[0]; if(!file) return;
  document.getElementById('bulk-file-lbl').textContent = file.name;

  const data = await file.arrayBuffer();
  const wb = XLSX.read(data, {type:'array', cellDates:false});
  const sheet = wb.Sheets['Parts Upload'] || wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});

  _bulkRows = rows.map(rawRow => {
    const r = rawRow;
    return {
    pn: String(r['Part No.*']||'').trim(),
    name: String(r['Part Name*']||'').trim(),
    rev: String(r['Drawing Rev']||'Rev A').trim(),
    customer: String(r['Customer*']||'').trim(),
    program: String(r['Program / Vehicle']||'').trim(),
    engineer: String(r['Engineer']||'').trim(),
    ppapLevel: parseInt(r['PPAP Level (1-5)'])||3,
    partType: String(r['Part Type*']||'').trim(),
    partStatus: String(r['Part Status']||'Active').trim()||'Active',
    sop: String(r['Target SOP (dd-mmm-yy)']||'').trim(),
    material: String(r['Material Type']||'').trim(),
    pswDate: String(r['PSW Approval Date (dd-mmm-yy)']||'').trim(),
    notes: String(r['Notes']||'').trim(),
    ops: _extractBulkOps(rawRow)
  };}).filter(r => r.pn && r.name); // skip blank/example rows missing required fields

  _renderBulkPreview();
}

function _renderBulkPreview(){
  const validTypes = PART_TYPES;
  const existingPns = new Set(DB.parts.map(p=>p.pn.toLowerCase()));

  let errCount=0, warnCount=0;
  const rowsHtml = _bulkRows.map((r,i)=>{
    const issues=[];
    if(!r.customer) issues.push('Missing Customer');
    if(!validTypes.includes(r.partType)) issues.push(`Invalid Part Type: "${r.partType}"`);
    if(existingPns.has(r.pn.toLowerCase())) issues.push('⚠ Part No. already exists — will be SKIPPED');
    const hasErr = issues.some(x=>!x.startsWith('⚠'));
    const hasWarn = issues.some(x=>x.startsWith('⚠'));
    if(hasErr) errCount++;
    if(hasWarn) warnCount++;
    const rowColor = hasErr ? '#FFEAEA' : (hasWarn ? '#FFF3DC' : '');
    return `<tr style="background:${rowColor}">
      <td style="font-size:9px;color:var(--muted)">${i+1}</td>
      <td style="font-size:10px;font-weight:600;color:var(--accent)">${eH(r.pn)}</td>
      <td style="font-size:10px">${eH(r.name)}</td>
      <td style="font-size:10px">${eH(r.customer)||'<span style=\'color:var(--red)\'>—</span>'}</td>
      <td style="font-size:10px">${eH(r.partType)}</td>
      <td style="font-size:9px;color:${hasErr?'var(--red)':hasWarn?'var(--amber)':'var(--green)'}">${issues.join('; ')||'✓ OK'}</td>
    </tr>`;
  }).join('');

  document.getElementById('bulk-preview-area').innerHTML = `
    <div style="display:flex;gap:14px;margin-bottom:8px;font-size:11px">
      <span><b>${_bulkRows.length}</b> rows found</span>
      <span style="color:var(--red)"><b>${errCount}</b> errors (will be skipped)</span>
      <span style="color:var(--amber)"><b>${warnCount}</b> warnings (will be skipped)</span>
      <span style="color:var(--green)"><b>${_bulkRows.length-errCount-warnCount}</b> ready to import</span>
    </div>
    <div style="max-height:280px;overflow-y:auto;border:1.5px solid var(--border);border-radius:5px">
      <table class="tbl" style="width:100%">
        <thead style="position:sticky;top:0"><tr><th>#</th><th>Part No.</th><th>Name</th><th>Customer</th><th>Type</th><th>Status</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
    <div style="margin-top:4px;font-size:9px;color:var(--muted)">
      New Customers, Materials, or Processes not found in Registry will be auto-created.
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
      <button class="btn btn-s" onclick="closeMo()">Cancel</button>
      <button class="btn btn-p" onclick="_submitBulkUpload()" ${_bulkRows.length-errCount-warnCount<=0?'disabled':''}>Import ${_bulkRows.length-errCount-warnCount} Parts</button>
    </div>
  `;
}

async function _submitBulkUpload(){
  const btn = document.querySelector('#bulk-preview-area .btn-p');
  if(btn){ btn.disabled=true; btn.textContent='Importing...'; }
  try{
    const result = await _apiFetch('/parts/bulk-import', 'POST', { rows: _bulkRows });
    closeMo();
    await loadFromDB();
    rr();
    alert(`✅ Bulk upload complete!\n\nImported: ${result.imported}\nSkipped: ${result.skipped}`);
  } catch(e){
    alert('❌ Bulk upload failed: '+e.message);
    if(btn){ btn.disabled=false; btn.textContent='Retry Import'; }
  }
}

function savePartModal(){
  const pn=document.getElementById('mp-pn')?.value.trim();if(!pn){alert('Part Number required');return;}
  const ptVal=document.getElementById('mp-pt').value;
  const obj={pn,name:document.getElementById('mp-nm').value.trim(),rev:document.getElementById('mp-rv').value.trim()||'Rev A',
    customerId:parseInt(document.getElementById('mp-cu').value),program:document.getElementById('mp-pg').value.trim(),engineer:document.getElementById('mp-en').value.trim(),
    ppapLevel:parseInt(document.getElementById('mp-pl').value),partType:ptVal,
    sop:ptVal!=='Prototype (Test)'?fmtDate(document.getElementById('mp-sop').value):'',
    materialId:parseInt(document.getElementById('mp-mt').value),partStatus:document.getElementById('mp-st').value,
    pswDate:fmtDate(document.getElementById('mp-pswd').value),
    ops:_opRows.map(r=>({...r})),notes:document.getElementById('mp-nt').value.trim(),status:'on-track',
    drawingFile:_editIdx>=0?(DB.parts[_editIdx].drawingFile||''):''};
  const _drawingInput=document.getElementById('mp-drawing-file');
  const _drawingFile=_drawingInput?.files[0]||null;
  if(_editIdx>=0){
    const prev=DB.parts[_editIdx];
    obj.uid=prev.uid;obj.apqp=prev.apqp;obj.ppap=prev.ppap;obj.status=prev.status;
    const dbId=prev._dbId;
    const _editPayload={uid:obj.uid,pn:obj.pn,name:obj.name,rev:obj.rev,
      customer_id:obj.customerId,program:obj.program,engineer:obj.engineer,
      ppap_level:obj.ppapLevel,part_type:obj.partType,part_status:obj.partStatus,
      sop:obj.sop,material_id:obj.materialId,psw_date:obj.pswDate,notes:obj.notes,status:obj.status,
      ops:obj.ops.map(o=>({op:o.op,process_id:o.processId,machine:o.machine,ct:o.ct})),
      apqp:obj.apqp,ppap:obj.ppap};
    const _doEditSave=()=>_apiFetch('/parts/'+dbId,'PUT',_editPayload).then(()=>loadFromDB().then(()=>rr()));
    if(_drawingFile){
      _uploadDrawingFile(obj.uid,obj.pn,_drawingFile).then(fn=>{
        if(fn){_editPayload.drawing_file=fn;obj.drawingFile=fn;}
        _doEditSave();
      });
    } else { _doEditSave(); }
    DB.parts[_editIdx]=obj;
  } else {
    obj.uid=genUID();obj.apqp=blankApqp();obj.ppap=blankPpap();
    // Get a fresh UID from DB before saving to avoid duplicates
    _apiFetch('/next-uid').then(({uid}) => {
      obj.uid = uid;
      _apiFetch('/parts','POST',{
        uid:obj.uid,pn:obj.pn,name:obj.name,rev:obj.rev,
        customer_id:obj.customerId,program:obj.program,engineer:obj.engineer,
        ppap_level:obj.ppapLevel,part_type:obj.partType,part_status:obj.partStatus,
        sop:obj.sop,material_id:obj.materialId,psw_date:obj.pswDate,notes:obj.notes,status:obj.status,
        ops:obj.ops.map(o=>({op:o.op,process_id:o.processId,machine:o.machine,ct:o.ct})),
        apqp:obj.apqp,ppap:obj.ppap
      }).then(()=>loadFromDB().then(()=>rr()));
      obj._dbId=null;DB.parts.push(obj);DB.selPart=DB.parts.length-1;
      if(_drawingFile){
        _uploadDrawingFile(obj.uid,obj.pn,_drawingFile).then(fn=>{obj.drawingFile=fn;});
      }
    });
  }
  closeMo();rr();
}

  const cOpt=blankOpt+DB.reg.customers.map(c=>`<option ${c.name===selectedCust?'selected':''}>${eH(c.name)}</option>`).join('');

  // Filter parts by customer — if a customer is selected, only show that customer's parts
  const filteredParts=selectedCust
    ? DB.parts.filter(p=>getCust(p.customerId).name===selectedCust)
    : DB.parts;
  const noPartMsg=selectedCust&&!filteredParts.length?`<option disabled>— No parts registered for this customer —</option>`:'';

  const allStages=[...fixedStages,...partOps.filter(n=>!fixedStages.includes(n))];
  const sbProcs=(sb?.procs && sb.procs.length)?sb.procs:allStages.map(n=>({name:n,startPlan:'',startActual:'',endPlan:'',endActual:''}));

    return `<div class="proc-stage">
      <div class="proc-stage-hdr"><span style="font-size:10.5px;font-weight:700">${proc.name}</span><span style="font-size:9px;color:${stc};font-weight:600">${sb?st.charAt(0).toUpperCase()+st.slice(1):'—'}</span></div>

        <div class="fld"><label>Complete Date (Actual)</label><input id="ps-ea-${pi}" data-date value="${eH(proc.endActual)}" placeholder="dd-mmm-yy"></div>
      </div>
    </div>`;}).join('');
  document.getElementById('mdl-title').textContent=sb?`Edit Sample Build — ${sb.id}`:'Add New Sample Build';
  document.getElementById('mdl-body').innerHTML=`
    <div class="fg" style="margin-bottom:10px">
      <div class="fld"><label>Customer</label><select id="sm-cu" onchange="_onSampleCustChange(this.value)">${cOpt}</select></div>
      <div class="fld"><label>Part Number</label><select id="sm-pn" onchange="_onSamplePartChange(this.value)">${pOpt}</select></div>
